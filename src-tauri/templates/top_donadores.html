<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Top Donadores - GZ7Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;900&family=JetBrains+Mono:wght@700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }
    .leaderboard-card {
      width: 360px;
      background: rgba(12, 12, 18, 0.88);
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85), 0 0 25px rgba(255, 215, 0, 0.25);
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease;
    }
    .leaderboard-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 215, 0, 0.3);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title-text {
      font-size: 19px;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 8px #00e676;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .donor-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .donor-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 12px;
      transition: all 0.3s ease;
    }
    .donor-row:first-child {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.15) 0%, rgba(255, 215, 0, 0.03) 100%);
      border-color: rgba(255, 215, 0, 0.5);
    }
    .donor-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .donor-rank {
      font-size: 16px;
      font-weight: 900;
      min-width: 24px;
      text-align: center;
    }
    .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.6); }
    .rank-2 { color: #e0e0e0; }
    .rank-3 { color: #cd7f32; }

    .donor-user {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    .donor-coins {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: #ffd700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .empty-state {
      text-align: center;
      color: #8888a4;
      font-size: 13px;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="leaderboard-card" id="card">
    <div class="leaderboard-title">
      <div class="title-text">
        <span style="display: flex; align-items: center; gap: 6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFA751" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>
          TOP DONADORES
        </span>
      </div>
      <div class="live-dot"></div>
    </div>

    <div class="donor-list" id="donor-list">
      <div class="empty-state">Esperando regalos en vivo...</div>
    </div>
  </div>

  <script>
    const donorList = document.getElementById('donor-list');
    const card = document.getElementById('card');
    const donorsMap = new Map(); // username -> coins

    const evt = new EventSource('/api/eventos');
    evt.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        if (d.duel?.gift_scale) {
          card.style.transform = 'scale(' + (d.duel.gift_scale / 100) + ')';
        }
        if (d.type === 'gift' && d.data) {
          const user = String(d.data.user || 'Donador').replace(/^@/, '');
          const coins = Number(d.data.coins) || 1;
          const current = donorsMap.get(user) || 0;
          donorsMap.set(user, current + coins);
          updateLeaderboard();
        }
      } catch (err) {}
    };

    function updateLeaderboard() {
      const sorted = Array.from(donorsMap.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      if (sorted.length === 0) return;

      donorList.innerHTML = sorted.map(([user, coins], idx) => {
        const rank = idx + 1;
        const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
        const medal = rank === 1 ? '#01' : (rank === 2 ? '#02' : (rank === 3 ? '#03' : `#0${rank}`));
        return `
          <div class="donor-row">
            <div class="donor-left">
              <span class="donor-rank ${rankClass}">${medal}</span>
              <span class="donor-user">@${user}</span>
            </div>
            <span class="donor-coins">
              ${coins.toLocaleString()}
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>
            </span>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
