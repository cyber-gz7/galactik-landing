<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alertas & Chroma Key - GALACTK PANEL by GZ7</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      color-scheme: none !important;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      pointer-events: none;
    }

    .alert-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      transform: scale(0.65) translateY(35px);
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .alert-stage.show {
      opacity: 1;
      transform: scale(var(--scale, 1)) translateY(0);
    }

    .media-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 560px;
      max-height: 420px;
    }

    #chroma-canvas, #alert-video-direct, #alert-img {
      max-width: 520px;
      max-height: 380px;
      object-fit: contain;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.75));
      border-radius: 12px;
    }

    .alert-card {
      background: rgba(0, 0, 0, 0);
      border: none;
      border-radius: 20px;
      padding: 16px 34px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: none;
      text-shadow: 0 3px 8px rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.9);
      max-width:100vw;
      overflow-wrap:anywhere;
    }

    .alert-icon {
      font-size: 48px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
    }

    .alert-user {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.65), 2px 2px 0 #000;
    }

    .alert-gift {
      font-size: 22px;
      font-weight: 800;
      color: #ffe600;
      text-shadow: 1.5px 1.5px 0 #000;
    }
  </style>
</head>
<body>
  <div class="alert-stage" id="alert-stage">
    <div class="media-stage" id="media-stage" style="display: none;">
      <video id="alert-video-hidden" crossorigin="anonymous" playsinline muted style="display: none;"></video>
      <canvas id="chroma-canvas" style="display: none;"></canvas>
      <video id="alert-video-direct" crossorigin="anonymous" playsinline muted style="display: none;"></video>
      <img id="alert-img" alt="" style="display: none;" />
    </div>

    <div class="alert-card" id="alert-box">
      <div class="alert-icon" id="alert-icon">🎁</div>
      <div>
        <div class="alert-user" id="alert-user">Donador</div>
        <div class="alert-gift" id="alert-gift">Regalo Enviado</div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('alert-stage');
    const mediaStage = document.getElementById('media-stage');
    const hiddenVideo = document.getElementById('alert-video-hidden');
    const directVideo = document.getElementById('alert-video-direct');
    const chromaCanvas = document.getElementById('chroma-canvas');
    const chromaCtx = chromaCanvas.getContext('2d', { willReadFrequently: true });
    const alertImg = document.getElementById('alert-img');
    const alertIcon = document.getElementById('alert-icon');
    const userEl = document.getElementById('alert-user');
    const giftEl = document.getElementById('alert-gift');

    let hideTimer = null;
    let rafId = null;
    let activeAudio = null;
    let autoDetectedKey = null;

    function hexToRgb(hex) {
      const clean = String(hex || '#00ff00').replace('#', '');
      const num = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function detectCornerBackgroundColor(imgData, width, height) {
      const data = imgData.data;
      const samples = [];
      const coords = [
        [2, 2], [width - 3, 2], [2, height - 3], [width - 3, height - 3],
        [6, 6], [width - 7, 6], [6, height - 7], [width - 7, height - 7]
      ];
      for (const [cx, cy] of coords) {
        if (cx >= 0 && cx < width && cy >= 0 && cy < height) {
          const i = (cy * width + cx) * 4;
          if (data[i + 3] > 200) {
            samples.push([data[i], data[i + 1], data[i + 2]]);
          }
        }
      }
      if (!samples.length) return { r: 0, g: 255, b: 0 };
      const sum = samples.reduce((acc, s) => [acc[0] + s[0], acc[1] + s[1], acc[2] + s[2]], [0, 0, 0]);
      return {
        r: Math.round(sum[0] / samples.length),
        g: Math.round(sum[1] / samples.length),
        b: Math.round(sum[2] / samples.length)
      };
    }

    function stopChromaLoop() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      try { hiddenVideo.pause(); } catch (e) {}
      try { directVideo.pause(); } catch (e) {}
    }

    function startChromaRenderLoop(cfg) {
      const similarity = Math.max(0.05, Math.min(0.95, (Number(cfg.similarity) || 38) / 100));
      const smoothness = Math.max(0.02, Math.min(0.5, (Number(cfg.smoothness) || 12) / 100));
      const manualRgb = hexToRgb(cfg.chromaColor || '#00ff00');
      const isAuto = cfg.chromaMode === 'auto';
      autoDetectedKey = null;

      const maxThreshold = similarity * 441.67;
      const rampRange = smoothness * 441.67;

      function renderFrame() {
        if (hiddenVideo.paused || hiddenVideo.ended) return;
        const vw = hiddenVideo.videoWidth || 480;
        const vh = hiddenVideo.videoHeight || 360;
        if (vw > 0 && vh > 0) {
          const scale = Math.min(1, 520 / vw, 380 / vh);
          const cw = Math.max(1, Math.round(vw * scale));
          const ch = Math.max(1, Math.round(vh * scale));
          if (chromaCanvas.width !== cw || chromaCanvas.height !== ch) {
            chromaCanvas.width = cw;
            chromaCanvas.height = ch;
          }
          chromaCtx.drawImage(hiddenVideo, 0, 0, cw, ch);
          try {
            if (cfg.chromaEnabled === false) { rafId = requestAnimationFrame(renderFrame); return; }
            const frame = chromaCtx.getImageData(0, 0, cw, ch);
            const d = frame.data;
            if (isAuto && !autoDetectedKey) {
              autoDetectedKey = detectCornerBackgroundColor(frame, cw, ch);
            }
            const key = isAuto ? (autoDetectedKey || { r: 0, g: 255, b: 0 }) : manualRgb;
            const kr = key.r, kg = key.g, kb = key.b;
            const isGreenDominant = kg > kr + 35 && kg > kb + 35;

            for (let i = 0; i < d.length; i += 4) {
              const r = d[i], g = d[i + 1], b = d[i + 2];
              const dr = r - kr, dg = g - kg, db = b - kb;
              const dist = Math.sqrt(dr * dr + dg * dg + db * db);

              if (dist < maxThreshold) {
                d[i + 3] = 0;
              } else if (dist < maxThreshold + rampRange) {
                const alphaFactor = (dist - maxThreshold) / rampRange;
                d[i + 3] = Math.round(d[i + 3] * alphaFactor);
                if (isGreenDominant && g > r && g > b) {
                  d[i + 1] = Math.round((r + b) * 0.5);
                }
              } else if (isGreenDominant && g > r * 1.25 && g > b * 1.25) {
                d[i + 1] = Math.round((g + Math.max(r, b)) * 0.5);
              }
            }
            chromaCtx.putImageData(frame, 0, 0);
          } catch (err) { chromaCtx.clearRect(0, 0, cw, ch); }
        }
        rafId = requestAnimationFrame(renderFrame);
      }
      rafId = requestAnimationFrame(renderFrame);
    }

    function playCustomAlert(alertData) {
      stopChromaLoop();
      if (hideTimer) clearTimeout(hideTimer);

      userEl.textContent = alertData.title || alertData.user || '¡Evento en Vivo!';
      giftEl.textContent = alertData.subtitle || alertData.gift || '';
      alertIcon.textContent = alertData.icon || '⚡';

      hiddenVideo.style.display = 'none';
      chromaCanvas.style.display = 'none';
      directVideo.style.display = 'none';
      alertImg.style.display = 'none';
      mediaStage.style.display = 'none';

      const videoUrl = alertData.videoUrl || '';
      const imageUrl = alertData.imageUrl || '';

      if (videoUrl) {
        mediaStage.style.display = 'flex';
        {
          chromaCanvas.style.display = 'block';
          chromaCtx.clearRect(0, 0, chromaCanvas.width, chromaCanvas.height);
          hiddenVideo.src = videoUrl;
          hiddenVideo.currentTime = 0;
          hiddenVideo.loop = true;
          hiddenVideo.muted = Boolean(alertData.audioUrl);
          hiddenVideo.volume = Math.max(0, Math.min(1, (Number(alertData.videoVolume ?? 80)) / 100));
          hiddenVideo.onplay = () => startChromaRenderLoop(alertData);
          hiddenVideo.play().catch(() => {
            hiddenVideo.muted = true;
            hiddenVideo.play().catch(() => {});
          });
        }
      } else if (imageUrl) {
        mediaStage.style.display = 'flex';
        alertImg.style.display = 'block';
        alertImg.src = imageUrl;
      }

      if (alertData.audioUrl) {
        try {
          if (activeAudio) {
            activeAudio.pause();
            activeAudio = null;
          }
          activeAudio = new Audio(alertData.audioUrl);
          activeAudio.volume = Math.max(0, Math.min(1, (Number(alertData.audioVolume ?? 100)) / 100));
          activeAudio.play().catch(() => {});
        } catch (e) {}
      }

      stage.classList.toggle('show', !alertData.audioOnly);
      const durationMs = Math.max(1500, (Number(alertData.duration) || 4.5) * 1000);
      hideTimer = setTimeout(() => {
        stage.classList.remove('show');
        setTimeout(() => stopChromaLoop(), 400);
      }, durationMs);
    }

    const evt = new EventSource('/api/eventos');
    evt.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        if (d.duel?.gift_scale) {
          stage.style.setProperty('--scale', (d.duel.gift_scale / 100).toFixed(2));
        }
        if (d.type === 'custom_alert' && d.alert) {
          playCustomAlert(d.alert);
        } else if (d.type === 'gift' && d.data) {
          playCustomAlert({
            title: d.data.user || 'Donador',
            subtitle: `${d.data.title || 'Regalo'} (${d.data.coins || 1} 💎)`,
            icon: '🎁',
            duration: 3.8
          });
        }
      } catch (err) {}
    };
  </script>
</body>
</html>
