      animation: kineticPulseGlow 3s ease-in-out infinite;
    }

    body[data-theme="NEON"] .rule-tag,
    body[data-theme="NEON"] .win-counter {
      text-shadow:
        2px 2px 0 #000,
        -2px -2px 0 #000,
        0 0 10px currentColor,
        0 0 20px currentColor;
    }

    /* MINI-BARRA MANUAL AUTO-OCULTABLE */
    #manual-control-dock {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 99999;
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(3, 10, 24, 0.88);

      pointer-events: auto;
      transition: opacity 0.25s ease, transform 0.25s ease;
      transform: translateY(6px);

    #manual-control-dock:hover,

    .manual-dock-btn {

    .manual-dock-btn.red {

<body data-mode="full" data-theme="GALACTIC">
  <svg width="0" height="0" style="position:absolute;pointer-events:none;overflow:hidden;" aria-hidden="true">
    <defs>
      <filter id="gz7-fullhd-filter" color-interpolation-filters="sRGB">
        <feConvolveMatrix id="gz7-convolve" order="3" kernelMatrix="0 -0.35 0 -0.35 2.4 -0.35 0 -0.35 0" preserveAlpha="true" result="sharp" />
        <feComponentTransfer in="sharp">
          <feFuncR type="linear" slope="1.06" intercept="-0.02" />
          <feFuncG type="linear" slope="1.06" intercept="-0.02" />
          <feFuncB type="linear" slope="1.06" intercept="-0.02" />
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>

  <div id="stage-720x1080">
    <div class="top-win-wrapper" id="top-win-module">
      <div class="win-counter" id="win-counter" data-win-theme="GALACTIC">
        <span class="win-label" id="win-label-text">🏆 WINS:</span>

    <div class="center-duel-arena" id="duel-arena">
      <div class="duel-header-row">
        <div class="team-block" id="team-block-red">
          <div class="team-gift-wrap">
            <img id="center-red-img" src="/gifts/rose-1-coins.webp" alt="Red" class="team-img" onerror="this.src='/gifts/rose-1-coins.webp'" />
            <span class="team-gift-name" id="center-red-label">Rose</span>

          <span class="team-count" id="count-red">0</span>

        <div class="vs-emblem">VS</div>

        <div class="team-block" id="team-block-blue">
          <span class="team-count" id="count-blue">0</span>
          <div class="team-gift-wrap">
            <img id="center-blue-img" src="/gifts/gg-1-coins.webp" alt="Blue" class="team-img" onerror="this.src='/gifts/gg-1-coins.webp'" />
            <span class="team-gift-name" id="center-blue-label">GG</span>

      <div class="tug-of-war-track">

      </div>
      <div class="side-col-wrapper right">
        <div class="faction-col-badge heroes">🛡️ HÉROES</div>
        <div class="side-col col-right" id="col-right-container"></div>
      </div>
    </div>
  </div>

  <!-- MINI-BARRA DE CONTROL MANUAL & INYECCIÓN EN VIVO (Auto-ocultable / Tecla M) -->
  <div id="manual-control-dock" title="Control Manual de Pruebas (Atajos: 1 = Rosa, 2 = GG, 0 = Reset, M = Mostrar/Ocultar)">
    <button type="button" class="manual-dock-btn red" id="btn-dock-rose" title="Inyectar +1 Rosa / Bando Izquierdo (Tecla 1)">
      🌹 +1 Rosa
    </button>
    <button type="button" class="manual-dock-btn blue" id="btn-dock-gg" title="Inyectar +1 GG / Bando Derecho (Tecla 2)">
      🎮 +1 GG
    </button>
    <button type="button" class="manual-dock-btn red" id="btn-dock-plus10-red" title="+10 Puntos Izquierda">
      🔥 +10
    </button>
    <button type="button" class="manual-dock-btn blue" id="btn-dock-plus10-blue" title="+10 Puntos Derecha">
      ⚡ +10
    </button>
    <button type="button" class="manual-dock-btn reset" id="btn-dock-reset" title="Reiniciar Marcador (Tecla 0)">
      🔄 Reset
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pathName = window.location.pathname.toLowerCase();

    function detectOverlayMode() {
      const m = (urlParams.get('mode') || '').toLowerCase();
      if (m === 'wins' || m === 'win' || pathName.endsWith('/wins.html') || pathName.endsWith('/win.html')) {
        return 'wins';
      }
      if (m === 'left' || m === 'villanos' || pathName.endsWith('/villanos.html')) {
        return 'left';
      }
      if (m === 'right' || m === 'heroes' || pathName.endsWith('/heroes.html')) {
        return 'right';
      }
      if (m === 'sides' || m === 'lados' || pathName.includes('villanos-heroes') || pathName.includes('roblox-lados')) {
        return 'sides';
      }
      if (m === 'duel' || m === 'duelo' || pathName.includes('rosas-vs-ggs') || pathName.includes('duelo')) {
        return 'duel';
      }
      return 'full';
    }

    const OVERLAY_MODE = detectOverlayMode();
    document.body.setAttribute('data-mode', OVERLAY_MODE);

    const DEFAULT_LEFT_RULES = [
      { id: 'L1', gift_name: 'Lion', icon_file: 'lion-29999-coins.webp', label: '-20 WIN', is_bottom: false },
      { id: 'L2', gift_name: 'Rose', icon_file: 'rose-1-coins.webp', label: '+1 PTS', is_bottom: false },
      { id: 'L3', gift_name: 'Doughnut', icon_file: 'doughnut-30-coins.webp', label: '-30', is_bottom: false },
      { id: 'L4', gift_name: 'Game Controller', icon_file: 'game-controller-100-coins.webp', label: '-100', is_bottom: false },
      { id: 'L5', gift_name: 'Cat', icon_file: 'cat-222-coins.webp', label: '-300', is_bottom: false },
      { id: 'L6', gift_name: 'Money Gun', icon_file: 'money-gun-500-coins.webp', label: '-500', is_bottom: false },
      { id: 'L7', gift_name: 'Sunset Speedway', icon_file: 'sunset-speedway-10000-coins.webp', label: '-1000', is_bottom: false },
      { id: 'L8', gift_name: 'Bear with Rose', icon_file: 'bear-with-rose-400-coins.webp', label: '-1 WIN', is_bottom: true },
      { id: 'L9', gift_name: 'Fireworks', icon_file: 'fireworks-1088-coins.webp', label: '-3 WIN', is_bottom: true }
    ];

    const DEFAULT_RIGHT_RULES = [
      { id: 'R1', gift_name: 'Falcon', icon_file: 'falcon-10999-coins.webp', label: '+20 WIN', is_bottom: false },
      { id: 'R2', gift_name: 'Heart Me', icon_file: 'heart-me-1-coins.webp', label: '+10 PTS', is_bottom: false },
      { id: 'R3', gift_name: 'Capybara', icon_file: 'capybara-30-coins.webp', label: '+30', is_bottom: false },
      { id: 'R4', gift_name: 'GG', icon_file: 'gg-1-coins.webp', label: '+1', is_bottom: false },
      { id: 'R5', gift_name: 'Whale Diving', icon_file: 'whale-diving-2150-coins.webp', label: '+300', is_bottom: false },
      { id: 'R6', gift_name: 'Treasure Chest', icon_file: 'treasure-chest-1500-coins.webp', label: '+500', is_bottom: false },
      { id: 'R7', gift_name: 'Galaxy', icon_file: 'galaxy-1000-coins.webp', label: '+1000', is_bottom: false },
      { id: 'R8', gift_name: 'Cruiser', icon_file: 'cruiser-150-coins.webp', label: '+3 WIN', is_bottom: true },
      { id: 'R9', gift_name: 'Coral', icon_file: 'coral-499-coins.webp', label: '+1 WIN', is_bottom: true }
    ];

    let state = {
      wins: 0,
      targetWins: 10,
      redPoints: 0,
      bluePoints: 0,
      goalAction: 'INCREASE_TARGET',
      showSideColumns: true,
      centerRedName: 'Rose',
      centerRedIcon: 'rose-1-coins.webp',
      centerRedCoins: 1,
      centerRedSoundName: '',
      centerRedSoundUrl: '',
      centerBlueName: 'GG',
      centerBlueIcon: 'gg-1-coins.webp',
      centerBlueCoins: 1,
      centerBlueSoundName: '',
      centerBlueSoundUrl: '',
      themeStyle: urlParams.get('theme')?.toUpperCase() || 'GALACTIC',
      winLabel: 'WIN',
      winTheme: 'AUTO',
      showWinInSides: false,
      iconSize: 48,
      textSize: 20,
      itemGap: 8,
      sharpness: 140,
      winScale: 100,
      duelScale: 100,
      uiScale: 100,
      leftRules: DEFAULT_LEFT_RULES,
      rightRules: DEFAULT_RIGHT_RULES
    };

    const AUDIO_ENABLED = urlParams.get('audio') === '1';
    let overlayAudioEl = null;

    function playOverlayAudio(rawUrl, vol = 1.0) {
      if (!AUDIO_ENABLED || !rawUrl) return;
      try {
        if (overlayAudioEl) {
          overlayAudioEl.pause();
          overlayAudioEl = null;
        }
        let cleanUrl = String(rawUrl).trim();
        if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://') && !cleanUrl.startsWith('data:') && !cleanUrl.startsWith('/')) {
          cleanUrl = '/' + cleanUrl.replace(/^\.\//, '');
        }
        overlayAudioEl = new Audio(cleanUrl);
        overlayAudioEl.volume = Math.max(0, Math.min(1, Number(vol) || 1.0));
        overlayAudioEl.play().catch(() => {});
      } catch (e) {}
    }

    const stageEl = document.getElementById('stage-720x1080');
    const winLabelEl = document.getElementById('win-label-text');
    const valWins = document.getElementById('val-wins');
    const valTargetWins = document.getElementById('val-target-wins');
    const countRed = document.getElementById('count-red');
    const countBlue = document.getElementById('count-blue');
    const tugBarRed = document.getElementById('tug-bar-red');
    const duelSubtext = document.getElementById('duel-subtext');
    const colLeft = document.getElementById('col-left-container');
    const colRight = document.getElementById('col-right-container');
    const centerRedImg = document.getElementById('center-red-img');
    const centerBlueImg = document.getElementById('center-blue-img');
    const centerRedLabel = document.getElementById('center-red-label');
    const centerBlueLabel = document.getElementById('center-blue-label');
    const winCounterEl = document.getElementById('win-counter');
    const convolveEl = document.getElementById('gz7-convolve');

    function cleanGiftPath(raw) {
      if (!raw) return '/gifts/rose-1-coins.webp';
      const s = String(raw).trim();
      if (s.startsWith('http://') || s.startsWith('https://')) return s;
      const clean = s.replace(/^(\.?\/)?gifts\//i, '');
      return `/gifts/${clean || 'rose-1-coins.webp'}`;
    }

    function updateSharpnessFilter(sharpVal) {
      if (!convolveEl) return;
      const s = Math.max(100, Math.min(240, Number(sharpVal) || 140));
      const amt = ((s - 100) / 100) * 0.55;
      const center = (1 + 4 * amt).toFixed(3);
      const edge = (-amt).toFixed(3);
      convolveEl.setAttribute('kernelMatrix', `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`);
    }

    function updateStageAndMathematicalFit() {
      const vw = Math.max(100, window.innerWidth);
      const vh = Math.max(100, window.innerHeight);

      let baseScale = Math.min(vw / 720, vh / 1080);
      if (OVERLAY_MODE === 'duel' && (vh < 520 || (vw / vh) > 1.25)) {
        baseScale = Math.min(vw / 450, vh / 165);
      } else if (OVERLAY_MODE === 'wins' && (vh < 480 || (vw / vh) > 1.25)) {
        baseScale = Math.min(vw / 320, vh / 110);
      }

      const finalStageScale = baseScale * (state.uiScale / 100);
      document.documentElement.style.setProperty('--stage-scale', finalStageScale.toFixed(4));
      document.documentElement.style.setProperty('--win-scale', (state.winScale / 100).toFixed(2));
      document.documentElement.style.setProperty('--duel-scale', (state.duelScale / 100).toFixed(2));
      document.documentElement.style.setProperty('--icon-size', `${state.iconSize}px`);
      document.documentElement.style.setProperty('--text-size', `${state.textSize}px`);
      document.documentElement.style.setProperty('--item-gap', `${state.itemGap}px`);

      const includeWinsInSides = state.showWinInSides || urlParams.get('wins') === '1';
      document.body.setAttribute('data-sides-win', includeWinsInSides ? 'true' : 'false');

      let topOffset = 214;
      if (OVERLAY_MODE === 'sides') {
        topOffset = includeWinsInSides ? 88 : 18;
      } else if (OVERLAY_MODE === 'left' || OVERLAY_MODE === 'right') {
        topOffset = 18;
      }
      const availHeight = 1080 - topOffset - 16 - 30;
      const leftMainCount = state.leftRules.filter(r => !r.is_bottom).length;
      const rightMainCount = state.rightRules.filter(r => !r.is_bottom).length;
      const hasBottomRow = (state.leftRules.some(r => r.is_bottom) || state.rightRules.some(r => r.is_bottom)) ? 1 : 0;
      const totalRows = Math.max(1, Math.max(leftMainCount, rightMainCount) + hasBottomRow);

      const rowHeight = Math.max(state.iconSize, state.textSize * 1.25) + 12;
      const neededHeight = totalRows * rowHeight + Math.max(0, totalRows - 1) * state.itemGap;

      let fitScale = 1;
      if (neededHeight > availHeight) {
        fitScale = Math.max(0.01, availHeight / neededHeight);
      }
      document.documentElement.style.setProperty('--col-fit-scale', fitScale.toFixed(3));
    }

    function applyVisualTheme() {
      const validThemes = ['GALACTIC', 'SOL', 'CONTRASTE', 'MOVIMIENTO', 'NEON', 'TRANSPARENT'];
      const chosen = validThemes.includes(String(state.themeStyle).toUpperCase())
        ? String(state.themeStyle).toUpperCase()
        : 'GALACTIC';
      document.body.setAttribute('data-theme', chosen);

      const rawWinTheme = String(state.winTheme || 'AUTO').toUpperCase();
      const effectiveWinTheme = validThemes.includes(rawWinTheme) ? rawWinTheme : chosen;
      if (winCounterEl) {
        winCounterEl.setAttribute('data-win-theme', effectiveWinTheme);
      }
      if (winLabelEl) {
        winLabelEl.textContent = state.winLabel || 'WIN';
      }

      updateSharpnessFilter(state.sharpness);
      updateStageAndMathematicalFit();
    }

    function renderColumns() {
      const renderRulePill = (r) => {
        const hasSound = Boolean(r.sound_name || r.sound_url);
        const soundBadge = hasSound ? `<span class="rule-sound-badge" title="${r.sound_name || 'Audio'}">🔊</span>` : '';
        return `
          <div class="rule-item" data-rule-id="${r.id}" data-gift-name="${(r.gift_name || '').toLowerCase()}" data-sound-url="${r.sound_url || ''}" data-sound-vol="${r.sound_volume ?? 1.0}" data-duration="${r.duration_seconds ?? 5}">
            <img src="${cleanGiftPath(r.icon_file)}" class="rule-icon" onerror="this.src='/gifts/rose-1-coins.webp'" />
            <span class="rule-tag">${r.label}</span>
            ${soundBadge}
          </div>
        `;
      };

      const renderSide = (rules) => {
        const mainItems = rules.filter(r => !r.is_bottom);
        const bottomItems = rules.filter(r => r.is_bottom);
        let html = mainItems.map(renderRulePill).join('');
        if (bottomItems.length > 0) {
          html += `<div class="bottom-row-rules">` + bottomItems.map(renderRulePill).join('') + `</div>`;
        }
        return html;
      };

      colLeft.innerHTML = renderSide(state.leftRules);
      colRight.innerHTML = renderSide(state.rightRules);
      centerRedImg.src = cleanGiftPath(state.centerRedIcon || 'rose-1-coins.webp');
      centerBlueImg.src = cleanGiftPath(state.centerBlueIcon || 'gg-1-coins.webp');
      if (centerRedLabel) centerRedLabel.textContent = state.centerRedName || 'Rose';
      if (centerBlueLabel) centerBlueLabel.textContent = state.centerBlueName || 'GG';
      updateStageAndMathematicalFit();
    }

    function renderState(prevWins) {
      if (prevWins !== undefined && prevWins !== state.wins) {
        winCounterEl.classList.remove('bump');
        void winCounterEl.offsetWidth;
        winCounterEl.classList.add('bump');
        setTimeout(() => winCounterEl.classList.remove('bump'), 350);
      }
      const goalReached = state.wins >= state.targetWins;
      if (winLabelEl) winLabelEl.textContent = goalReached && state.goalAction === 'SHOW_VICTORY' ? '🏆 ¡VICTORIA!' : `🏆 ${state.winLabel || 'WINS'}:`;
      valWins.textContent = state.wins;
      valWins.classList.toggle('wins-negative', state.wins < 0);
      if (prevWins !== undefined && state.wins < prevWins) {
        valWins.classList.remove('wins-decreased');
        void valWins.offsetWidth;
        valWins.classList.add('wins-decreased');
      }
      valTargetWins.textContent = state.targetWins;
      countRed.textContent = state.redPoints.toLocaleString();
      countBlue.textContent = state.bluePoints.toLocaleString();
      document.getElementById('side-rules').style.display = state.showSideColumns ? '' : 'none';

      const total = state.redPoints + state.bluePoints;
      let redPct = 50;
      if (total > 0) {
        redPct = Math.min(96, Math.max(4, (state.redPoints / total) * 100));
      }
      tugBarRed.style.width = redPct + '%';

      const diff = state.redPoints - state.bluePoints;
      if (diff > 0) {
        duelSubtext.className = 'duel-subtext subtext-contra';
        duelSubtext.style.color = '';
        duelSubtext.textContent = `⏸ FRENAR / REINICIO · ROSA +${diff.toLocaleString()}`;
      } else if (diff < 0) {
        duelSubtext.className = 'duel-subtext subtext-favor';
        duelSubtext.style.color = '';
        duelSubtext.textContent = `🚲 AVANZAR · GG +${Math.abs(diff).toLocaleString()}`;
      } else {
        duelSubtext.className = 'duel-subtext';
        duelSubtext.style.color = '#ffe600';
        duelSubtext.textContent = '⚖️ EMPATE · MANTENER';
      }
    }

    function namesEquivalent(a, b) {
      const ca = String(a || '').toLowerCase().replace(/\s*\(x\d+\)\s*$/i, '').trim();
      const cb = String(b || '').toLowerCase().replace(/\s*\(x\d+\)\s*$/i, '').trim();
      if (!ca || !cb) return false;
      if (ca === cb) return true;

      const isSuperGgA = ca.includes('super gg') || ca.includes('supergg');
      const isSuperGgB = cb.includes('super gg') || cb.includes('supergg');
      if (isSuperGgA || isSuperGgB) {
        return isSuperGgA && isSuperGgB;
      }

      const isGiantRoseA = ca.includes('gigante') || ca.includes('giant') || ca === 'rosa (10)' || ca === 'rosa 10';
      const isGiantRoseB = cb.includes('gigante') || cb.includes('giant') || cb === 'rosa (10)' || cb === 'rosa 10';
      if (isGiantRoseA || isGiantRoseB) {
        return isGiantRoseA && isGiantRoseB;
      }

      const isRoseA = ca === 'rose' || ca === 'rosa' || ca === 'rosa oscura' || ca === 'rosa de luz' || ca === 'rosa roja' || ca === 'red rose';
      const isRoseB = cb === 'rose' || cb === 'rosa' || cb === 'rosa oscura' || cb === 'rosa de luz' || cb === 'rosa roja' || cb === 'red rose';
      if (isRoseA && isRoseB) return true;

      const isGgA = ca === 'gg' || ca === 'gg 2025' || ca === 'gg bendicion';
      const isGgB = cb === 'gg' || cb === 'gg 2025' || cb === 'gg bendicion';
      if (isGgA && isGgB) return true;

      if (ca.length >= 4 && cb.length >= 4 && (ca.includes(cb) || cb.includes(ca))) return true;
      return false;
    }

    function flashMatchingGift(giftTitle, eventSoundUrl) {
      if (!giftTitle) return;
      const g = String(giftTitle).toLowerCase().replace(/\s*\(x\d+\)\s*$/i, '').trim();
      let matchedSoundUrl = eventSoundUrl || '';
      let matchedSoundVol = 1.0;

      document.querySelectorAll('.rule-item').forEach(el => {
        const rn = el.getAttribute('data-gift-name') || '';
        if (namesEquivalent(rn, g)) {
          el.classList.remove('flash');
          void el.offsetWidth;
          el.classList.add('flash');
          const durationMs = Math.max(150, Number(el.getAttribute('data-duration') || 5) * 1000);
          setTimeout(() => el.classList.remove('flash'), durationMs);
          if (!matchedSoundUrl && el.getAttribute('data-sound-url')) {
            matchedSoundUrl = el.getAttribute('data-sound-url');
            matchedSoundVol = Number(el.getAttribute('data-sound-vol')) || 1.0;
          }
        }
      });

      const redName = String(state.centerRedName || 'rose').toLowerCase();
      const blueName = String(state.centerBlueName || 'gg').toLowerCase();
      if (namesEquivalent(redName, g)) {
        const b = document.getElementById('team-block-red');
        b?.classList.add('flash');
        setTimeout(() => b?.classList.remove('flash'), 500);
        if (!matchedSoundUrl && state.centerRedSoundUrl) {
          matchedSoundUrl = state.centerRedSoundUrl;
        }
      }
      if (namesEquivalent(blueName, g)) {
        const b = document.getElementById('team-block-blue');
        b?.classList.add('flash');
        setTimeout(() => b?.classList.remove('flash'), 500);
        if (!matchedSoundUrl && state.centerBlueSoundUrl) {
          matchedSoundUrl = state.centerBlueSoundUrl;
        }
      }

      if (matchedSoundUrl) {
        playOverlayAudio(matchedSoundUrl, matchedSoundVol);
      }
    }

    function applyServerPayload(gvg, duel, eventData) {
      if (duel && duel.gift_scale) {
        state.uiScale = Number(duel.gift_scale) || 100;
      }
      const gTitle = eventData?.giftName || eventData?.title || '';
      if (gTitle) {
        flashMatchingGift(gTitle, eventData.sound_url || eventData.audio_url || '');
      }
      if (!gvg) {
        updateStageAndMathematicalFit();
        return;
      }
      const prevWins = state.wins;
      state.wins = gvg.wins ?? state.wins;
      state.targetWins = gvg.target_wins ?? state.targetWins;
      state.redPoints = gvg.red_points ?? state.redPoints;
      state.bluePoints = gvg.blue_points ?? state.bluePoints;
      state.goalAction = gvg.goal_action ?? state.goalAction;
      state.showSideColumns = gvg.show_side_columns !== false;

      let themeChanged = false;
      if (!urlParams.get('theme') && gvg.theme_style && gvg.theme_style !== state.themeStyle) {
        state.themeStyle = gvg.theme_style;
        themeChanged = true;
      }
      if (gvg.win_label && gvg.win_label !== state.winLabel) {
        state.winLabel = gvg.win_label;
        themeChanged = true;
      }
      if (gvg.win_theme && gvg.win_theme !== state.winTheme) {
        state.winTheme = gvg.win_theme;
        themeChanged = true;
      }
      if (gvg.show_win_in_sides !== undefined && Boolean(gvg.show_win_in_sides) !== state.showWinInSides) {
        state.showWinInSides = Boolean(gvg.show_win_in_sides);
        themeChanged = true;
      }
      if (gvg.icon_size && Number(gvg.icon_size) !== state.iconSize) {
        state.iconSize = Number(gvg.icon_size);
        themeChanged = true;
      }
      if (gvg.text_size && Number(gvg.text_size) !== state.textSize) {
        state.textSize = Number(gvg.text_size);
        themeChanged = true;
      }
      if (gvg.item_gap !== undefined && Number(gvg.item_gap) !== state.itemGap) {
        state.itemGap = Number(gvg.item_gap);
        themeChanged = true;
      }
      if (gvg.sharpness && Number(gvg.sharpness) !== state.sharpness) {
        state.sharpness = Number(gvg.sharpness);
        themeChanged = true;
      }
      if (gvg.win_scale && Number(gvg.win_scale) !== state.winScale) {
        state.winScale = Number(gvg.win_scale);
        themeChanged = true;
      }
      if (gvg.duel_scale && Number(gvg.duel_scale) !== state.duelScale) {
        state.duelScale = Number(gvg.duel_scale);
        themeChanged = true;
      }

      let rulesChanged = false;
      if (gvg.center_red_name && gvg.center_red_name !== state.centerRedName) {
        state.centerRedName = gvg.center_red_name;
        rulesChanged = true;
      }
      if (gvg.center_red_icon && gvg.center_red_icon !== state.centerRedIcon) {
        state.centerRedIcon = gvg.center_red_icon;
        rulesChanged = true;
      }
      if (gvg.center_red_sound_name !== undefined && gvg.center_red_sound_name !== state.centerRedSoundName) {
        state.centerRedSoundName = gvg.center_red_sound_name || '';
        rulesChanged = true;
      }
      if (gvg.center_red_sound_url !== undefined && gvg.center_red_sound_url !== state.centerRedSoundUrl) {
        state.centerRedSoundUrl = gvg.center_red_sound_url || '';
        rulesChanged = true;
      }
      if (gvg.center_blue_name && gvg.center_blue_name !== state.centerBlueName) {
        state.centerBlueName = gvg.center_blue_name;
        rulesChanged = true;
      }
      if (gvg.center_blue_icon && gvg.center_blue_icon !== state.centerBlueIcon) {
        state.centerBlueIcon = gvg.center_blue_icon;
        rulesChanged = true;
      }
      if (gvg.center_blue_sound_name !== undefined && gvg.center_blue_sound_name !== state.centerBlueSoundName) {
        state.centerBlueSoundName = gvg.center_blue_sound_name || '';
        rulesChanged = true;
      }
      if (gvg.center_blue_sound_url !== undefined && gvg.center_blue_sound_url !== state.centerBlueSoundUrl) {
        state.centerBlueSoundUrl = gvg.center_blue_sound_url || '';
        rulesChanged = true;
      }
      if (Array.isArray(gvg.left_rules)) {
        state.leftRules = gvg.left_rules;
        rulesChanged = true;
      }
      if (Array.isArray(gvg.right_rules)) {
        state.rightRules = gvg.right_rules;
        rulesChanged = true;
      }

      if (themeChanged || rulesChanged) {
        applyVisualTheme();
      }
      if (rulesChanged) {
        renderColumns();
      }
      renderState(prevWins);
    }

    window.addEventListener('resize', updateStageAndMathematicalFit);
    applyVisualTheme();
    renderColumns();
    renderState();

    fetch('/api/estado')
      .then(res => res.json())
      .then(d => {
        if (d) applyServerPayload(d.gift_vs_gift, d.duel);
      })
      .catch(() => {});

    const evt = new EventSource('/api/eventos');
    evt.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        applyServerPayload(d.gift_vs_gift, d.duel, d.data);
      } catch (err) {}
    };

    // -----------------------------------------------------------------
    // CONTROL MANUAL & INYECCIÓN DE PRUEBAS (+1 Rosa, +1 GG, Combos, Reset)
    // -----------------------------------------------------------------
    const dockEl = document.getElementById('manual-control-dock');

    function sendManualGift(side, coins = 1, giftName = null) {
      const gName = giftName || (side === 'LEFT' ? (state.centerRedName || 'Rose') : (state.centerBlueName || 'GG'));
      const effectiveCoins = Math.max(1, Number(coins) || 1);

      const prevWins = { red: state.redWins, blue: state.blueWins };
      if (side === 'LEFT') {
        state.redPoints = (Number(state.redPoints) || 0) + effectiveCoins;
        triggerBump('red', gName, effectiveCoins);
      } else if (side === 'RIGHT') {
        state.bluePoints = (Number(state.bluePoints) || 0) + effectiveCoins;
        triggerBump('blue', gName, effectiveCoins);
      } else if (side === 'RESET') {
        state.redPoints = 0;
        state.bluePoints = 0;
      }
      renderState(prevWins);

      fetch('/api/test-gift', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          side,
          giftName: gName,
          coins: effectiveCoins,
          repeatCount: 1,
          donor: 'Manual'
        })
      }).catch(() => {});
    }

    document.getElementById('btn-dock-rose')?.addEventListener('click', () => sendManualGift('LEFT', state.centerRedCoins || 1, state.centerRedName || 'Rose'));
    document.getElementById('btn-dock-gg')?.addEventListener('click', () => sendManualGift('RIGHT', state.centerBlueCoins || 1, state.centerBlueName || 'GG'));
    document.getElementById('btn-dock-plus10-red')?.addEventListener('click', () => sendManualGift('LEFT', 10, state.centerRedName || 'Rose'));
    document.getElementById('btn-dock-plus10-blue')?.addEventListener('click', () => sendManualGift('RIGHT', 10, state.centerBlueName || 'GG'));
    document.getElementById('btn-dock-reset')?.addEventListener('click', () => sendManualGift('RESET', 0));

    // Atajos de Teclado Globales:
    // 1 = +1 Rosa (Bando Izquierdo)
    // 2 = +1 GG (Bando Derecho)
    // 0 = Reset (0 - 0)
    // M = Mostrar / Ocultar barra de control
    window.addEventListener('keydown', (e) => {
      if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.key === '1') {
        sendManualGift('LEFT', state.centerRedCoins || 1, state.centerRedName || 'Rose');
      } else if (e.key === '2') {
        sendManualGift('RIGHT', state.centerBlueCoins || 1, state.centerBlueName || 'GG');
      } else if (e.key === '0') {
        sendManualGift('RESET', 0);
      } else if (e.key === 'm' || e.key === 'M') {
        if (dockEl) dockEl.classList.toggle('force-show');
      }
    });
  </script>
</body>
</html>
