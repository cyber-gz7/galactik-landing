<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Interactive Overlay - GALACTK PANEL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700;800&display=swap');

    :root {
      --ui-scale: 1;
      --neon-cyan: #00f0ff;
      --neon-blue: #0088ff;
      --neon-gold: #ffe600;
      --neon-pink: #ff2a85;
      --neon-orange: #ff6600;
      --bg-glass: rgba(8, 14, 24, 0.72);
      --border-glass: rgba(0, 240, 255, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
      pointer-events: none;
    }

    #mc-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 16px;
      transform: scale(var(--ui-scale, 1));
      transform-origin: top center;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      background: transparent !important;
    }

    /* BARRA SUPERIOR DE ESTADO SIN FACCIONES */
    .mc-topbar-hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      z-index: 10;
    }

    .hud-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 999px;
      padding: 6px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 14px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* BADGE CORAZÓN VECTORIAL SVG CON 50 EN EL CENTRO */
    .pill-likes-goal {
      border-color: rgba(255, 42, 133, 0.6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 16px rgba(255, 42, 133, 0.3);
      padding: 4px 14px 4px 8px;
    }

    .hud-heart-wrapper {
      width: 38px;
      height: 38px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .svg-heart-goal {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px rgba(255, 0, 100, 0.8));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .heart-pulse-active {
      animation: heartBeatGoal 1.1s ease-in-out infinite;
    }

    .heart-pop-burst {
      animation: heartPopBurst 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.4);
    }

    @keyframes heartBeatGoal {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.15); }
      40% { transform: scale(0.98); }
      60% { transform: scale(1.1); }
    }

    @keyframes heartPopBurst {
      0% { transform: scale(1); }
      50% { transform: scale(1.35) rotate(-5deg); }
      100% { transform: scale(1); }
    }

    .likes-goal-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .likes-goal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 800;
      color: #ff5599;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .likes-goal-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 1px 2px #000;
    }

    /* BADGE SEGUIDOR */
    .pill-follow {
      border-color: rgba(0, 240, 255, 0.55);
    }

    .svg-follow {
      width: 20px;
      height: 20px;
      color: var(--neon-cyan);
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.8));
    }

    .hud-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #9cb3c9;
      text-transform: uppercase;
    }

    .hud-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-follow .hud-value {
      color: var(--neon-cyan);
    }

    /* BADGE TÓTEMS STACKEABLES (UNIFICADO) */
    .pill-totems-stack {
      border-color: rgba(255, 230, 0, 0.55);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 14px rgba(255, 230, 0, 0.2);
    }

    .svg-totem-icon {
      width: 22px;
      height: 22px;
      filter: drop-shadow(0 0 6px rgba(255, 230, 0, 0.8));
    }

    .pill-totems-stack .hud-value {
      color: var(--neon-gold);
    }

    /* CONTENEDOR MODULAR DE REGALOS (CAROUSEL / FLAT / STATIC) */
    .layout-carousel {
      width: min(96vw, 840px);
      overflow: hidden;
      position: relative;
      padding: 10px 0;
      mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      background: transparent !important;
    }

    .carousel-track {
      display: flex;
      gap: 14px;
      width: max-content;
      animation: carouselScroll 28s linear infinite;
      will-change: transform;
    }

    .carousel-track:hover {
      animation-play-state: paused;
    }

    @keyframes carouselScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* TARJETA DE EVENTO / PLUGIN ILUSTRADA */
    .mc-card {
      width: 144px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-shrink: 0;
      position: relative;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }

    .mc-card:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: var(--neon-cyan);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8), 0 0 18px rgba(0, 240, 255, 0.35);
    }

    /* MULTIPLICADOR / BADGE SUPERIOR */
    .mc-badge-mult {
      position: absolute;
      top: -8px;
      right: -6px;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1.5px solid #fff;
      box-shadow: 0 2px 8px rgba(255, 0, 85, 0.6);
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .mc-badge-mult.blue {
      background: linear-gradient(135deg, #0088ff, #00f0ff);
      box-shadow: 0 2px 8px rgba(0, 240, 255, 0.6);
    }

    .mc-badge-mult.gold {
      background: linear-gradient(135deg, #ff9900, #ffe600);
      color: #000;
      box-shadow: 0 2px 8px rgba(255, 230, 0, 0.6);
    }

    .mc-card-img-wrap {
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      position: relative;
    }

    .mc-card-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.85));
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mc-card:hover .mc-card-img {
      transform: scale(1.14);
    }

    .mc-card-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 1px 1px 0 #000;
      line-height: 1.15;
      margin-bottom: 4px;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    .mc-card-giftname {
      font-size: 11.5px;
      font-weight: 700;
      color: #e2f4ff;
      opacity: 0.95;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .mc-card-coins {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--neon-gold);
      background: rgba(255, 230, 0, 0.12);
      border: 1px solid rgba(255, 230, 0, 0.35);
      padding: 2px 8px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* ESTILO PLANO / FLAT */
    .layout-flat {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: 96vw;
    }

    .flat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 24, 42, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 10px;
      padding: 5px 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .flat-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    }

    .flat-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .flat-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--neon-cyan);
    }

    .flat-coins {
      font-size: 10px;
      color: #9cb3c9;
    }

    /* ESTILO ESTÁTICO / GRID */
    .layout-static {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
      gap: 12px;
      max-width: min(96vw, 840px);
      padding: 10px;
    }

    /* TOAST DE EVENTOS */
    .mc-event-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(8, 14, 24, 0.9);
      border: 1.5px solid var(--neon-cyan);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 240, 255, 0.35);
      border-radius: 14px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
    }

    .mc-event-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-icon-box {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      flex-shrink: 0;
    }

    .toast-user {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .toast-desc {
      font-size: 11px;
      font-weight: 700;
      color: var(--neon-cyan);
    }

    /* CORAZONES FLOTANTES */
    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      animation: floatUpFade 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--rnd-x, 0px), -120px, 0) scale(1.3);
      }
    }
  </style>
</head>
<body>
  <div id="mc-root">
    <!-- BARRA SUPERIOR DE ESTADO MODULAR (SIN FACCIONES) -->
    <header class="mc-topbar-hud" id="topbar-hud">
      <!-- Likes Goal con SVG de Corazón y 50 central -->
      <div class="hud-pill pill-likes-goal" id="hud-likes-goal-pill" title="50 Me gusta disparan impulso de lobo guardián">
        <div class="hud-heart-wrapper">
          <svg class="svg-heart-goal heart-pulse-active" id="hud-heart-goal-svg" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="heartGradGoal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff0055"/>
                <stop offset="100%" stop-color="#ff5500"/>
              </linearGradient>
            </defs>
            <path fill="url(#heartGradGoal)" d="M50 88.5L43.8 82.9C21.8 62.9 7.3 49.8 7.3 33.6C7.3 20.4 17.7 10 30.9 10C38.3 10 45.4 13.5 50 18.9C54.6 13.5 61.7 10 69.1 10C82.3 10 92.7 20.4 92.7 33.6C92.7 49.8 78.2 62.9 56.2 82.9L50 88.5Z"/>
            <text x="50" y="47" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'JetBrains Mono', 'Orbitron', monospace" font-size="28" font-weight="900">50</text>
          </svg>
        </div>
        <div class="likes-goal-meta">
          <span class="likes-goal-title">50 LIKES</span>
          <span class="likes-goal-count"><span id="likes-current-cycle">0</span> / 50</span>
        </div>
      </div>

      <!-- Badge Seguidor SVG -->
      <div class="hud-pill pill-follow" id="hud-follow-pill" title="Último seguidor registrado">
        <svg class="svg-follow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        <span class="hud-label">FOLLOW:</span>
        <span class="hud-value" id="hud-last-follower">@Streamer</span>
      </div>

      <!-- Tótems Stackeables Activos -->
      <div class="hud-pill pill-totems-stack" id="hud-totems-pill" title="Tótems de inmortalidad stackeables">
        <svg class="svg-totem-icon" viewBox="0 0 24 24" fill="none" stroke="#ffe600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span class="hud-label">TÓTEMS:</span>
        <span class="hud-value" id="hud-totems-count">∞ Stackeable</span>
      </div>
    </header>

    <!-- Contenedor dinámico según estilo (carousel | static | flat) -->
    <main id="mc-content-container"></main>
  </div>

  <!-- TOAST DE EVENTOS -->
  <aside class="mc-event-toast" id="mc-event-toast" aria-live="polite">
    <div class="toast-icon-box" id="toast-icon-box"></div>
    <div>
      <div class="toast-user" id="toast-user">@Usuario</div>
      <div class="toast-desc" id="toast-desc">¡Acción Activada!</div>
    </div>
  </aside>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pathName = window.location.pathname.toLowerCase();

    function detectInitialStyle() {
      if (urlParams.get('style')) return urlParams.get('style');
      if (pathName.includes('estatico') || pathName.includes('static')) return 'static';
      if (pathName.includes('plano') || pathName.includes('flat')) return 'flat';
      return 'carousel';
    }

    let likesCycle = 0;
    let totalLikes = 0;

    let mcState = {
      style: detectInitialStyle(),
      showTotems: true,
      lastFollower: 'En espera...',
      totalLikes: 0,
      items: [
        { id: '1', gift_name: 'Rosa', icon_file: 'rose-1-coins.webp', coins: 1, action_label: '💥 Kaboom x10', mult: 'x10' },
        { id: '2', gift_name: 'GG', icon_file: 'gg-1-coins.webp', coins: 1, action_label: '🧨 TNT x10', mult: 'x10' },
        { id: '3', gift_name: 'Heart Me', icon_file: 'heart-me-1-coins.webp', coins: 1, action_label: '⚡ Thunder + Alerta', mult: 'PRIOR' },
        { id: '4', gift_name: 'Finger Heart', icon_file: 'finger-heart-5-coins.webp', coins: 5, action_label: '⚡ Thunder x10', mult: 'x10' },
        { id: '5', gift_name: 'Doughnut', icon_file: 'doughnut-30-coins.webp', coins: 30, action_label: '⚔️ Kit Armadura OP', mult: 'KIT' },
        { id: '6', gift_name: 'Capybara', icon_file: 'capybara-30-coins.webp', coins: 30, action_label: '🛡️ +25 Tótems Stack', mult: '+25' },
        { id: '7', gift_name: 'Game Controller', icon_file: 'game-controller-100-coins.webp', coins: 100, action_label: '🧟 Horda Zombies x500', mult: 'x500' },
        { id: '8', gift_name: 'Sun Crown', icon_file: 'sun-crown-199-coins.webp', coins: 199, action_label: '☀️ Sol Cruel', mult: 'SOL' },
        { id: '9', gift_name: 'Corgi', icon_file: 'corgi-299-coins.webp', coins: 299, action_label: '🛡️ +124 Tótems Stack', mult: '+124' },
        { id: '10', gift_name: 'Money Gun', icon_file: 'money-gun-500-coins.webp', coins: 500, action_label: '🐉 Invocación Dragón', mult: 'BOSS' },
        { id: '11', gift_name: 'Galaxy', icon_file: 'galaxy-1000-coins.webp', coins: 1000, action_label: '💀 La Parka Final', mult: 'FINAL' },
        { id: '12', gift_name: 'Lion', icon_file: 'lion-29999-coins.webp', coins: 29999, action_label: '🔥 Apocalipsis Total', mult: 'ULTRA' }
      ]
    };

    const container = document.getElementById('mc-content-container');
    const hudLastFollower = document.getElementById('hud-last-follower');
    const likesCurrentCycleEl = document.getElementById('likes-current-cycle');
    const hudHeartGoalSvg = document.getElementById('hud-heart-goal-svg');
    const eventToast = document.getElementById('mc-event-toast');
    const toastIconBox = document.getElementById('toast-icon-box');
    const toastUser = document.getElementById('toast-user');
    const toastDesc = document.getElementById('toast-desc');
    const mcRoot = document.getElementById('mc-root');

    function cleanGiftPath(raw) {
      if (!raw) return '/gifts/rose-1-coins.webp';
      const s = String(raw).trim();
      if (s.startsWith('http://') || s.startsWith('https://')) return s;
      const clean = s.replace(/^(\.?\/)?gifts\//i, '');
      return `/gifts/${clean || 'rose-1-coins.webp'}`;
    }

    function extractMultiplierBadge(actionLabel, coins) {
      const txt = String(actionLabel || '');
      const match = txt.match(/x\d+|\+\d+/i);
      if (match) return match[0];
      if (txt.toLowerCase().includes('drag')) return '🐉';
      if (txt.toLowerCase().includes('parka') || txt.toLowerCase().includes('muerte')) return '💀';
      if (txt.toLowerCase().includes('sol')) return '☀️';
      if (txt.toLowerCase().includes('kit') || txt.toLowerCase().includes('armadura')) return '⚔️';
      if (txt.toLowerCase().includes('totem')) return '🛡️';
      if (coins >= 1000) return '⭐';
      return 'x1';
    }

    function renderOverlay() {
      hudLastFollower.textContent = mcState.lastFollower || '@Streamer';

      const items = Array.isArray(mcState.items) && mcState.items.length > 0 ? mcState.items : [];
      const activeStyle = urlParams.get('style') || (
        pathName.includes('estatico') ? 'static' :
        pathName.includes('plano') ? 'flat' :
        mcState.style || 'carousel'
      );

      if (activeStyle === 'flat') {
        container.className = 'layout-flat';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const mult = item.mult || extractMultiplierBadge(item.action_label, item.coins);
          return `
            <div class="flat-pill mc-item-node" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <img src="${gSrc}" class="flat-icon" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/rose-1-coins.webp';" />
              <div class="flat-meta">
                <span class="flat-action">${item.action_label || item.gift_name}</span>
                <span class="flat-coins">${item.gift_name} • ${item.coins} 🪙 (${mult})</span>
              </div>
            </div>
          `;
        }).join('');
      } else if (activeStyle === 'static') {
        container.className = 'layout-static';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const mult = item.mult || extractMultiplierBadge(item.action_label, item.coins);
          return `
            <div class="mc-card mc-item-node" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <span class="mc-badge-mult ${item.coins >= 500 ? 'gold' : item.coins >= 30 ? 'blue' : ''}">${mult}</span>
              <div class="mc-card-img-wrap">
                <img src="${gSrc}" class="mc-card-img" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/rose-1-coins.webp';" />
              </div>
              <div class="mc-card-action">${item.action_label || item.gift_name}</div>
              <div class="mc-card-giftname">${item.gift_name}</div>
              <div class="mc-card-coins">${item.coins} 🪙</div>
            </div>
          `;
        }).join('');
      } else {
        const loopItems = items.length > 0 ? [...items, ...items] : [];
        container.className = 'layout-carousel';
        container.innerHTML = `<div class="carousel-track">` + loopItems.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const mult = item.mult || extractMultiplierBadge(item.action_label, item.coins);
          return `
            <div class="mc-card mc-item-node" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <span class="mc-badge-mult ${item.coins >= 500 ? 'gold' : item.coins >= 30 ? 'blue' : ''}">${mult}</span>
              <div class="mc-card-img-wrap">
                <img src="${gSrc}" class="mc-card-img" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/rose-1-coins.webp';" />
              </div>
              <div class="mc-card-action">${item.action_label || item.gift_name}</div>
              <div class="mc-card-giftname">${item.gift_name}</div>
              <div class="mc-card-coins">${item.coins} 🪙</div>
            </div>
          `;
        }).join('') + `</div>`;
      }
    }

    let toastTimeout = null;
    function triggerToast(type, user, desc) {
      clearTimeout(toastTimeout);
      eventToast.className = 'mc-event-toast show';
      if (type === 'follow') {
        toastIconBox.innerHTML = `
          <svg style="width:20px;height:20px;color:var(--neon-cyan);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
        `;
      } else if (type === 'like') {
        toastIconBox.innerHTML = `
          <svg style="width:20px;height:20px;color:#ff0055;" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        `;
      } else {
        toastIconBox.innerHTML = `
          <svg style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="#ffe600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"/>
            <rect x="2" y="7" width="20" height="5"/>
            <line x1="12" y1="22" x2="12" y2="7"/>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
          </svg>
        `;
      }
      toastUser.textContent = '@' + String(user || 'Usuario').replace(/^@/, '');
      toastDesc.textContent = desc || '';
      toastTimeout = setTimeout(() => {
        eventToast.classList.remove('show');
      }, 3500);
    }

    function spawnFloatingHeart() {
      const h = document.createElement('div');
      h.className = 'floating-heart';
      const rect = hudHeartGoalSvg.getBoundingClientRect();
      const x = rect.left + rect.width / 2 + (Math.random() * 20 - 10);
      const y = rect.top;
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      h.style.setProperty('--rnd-x', (Math.random() * 60 - 30) + 'px');
      h.innerHTML = `
        <svg style="width:22px;height:22px;fill:#ff0055;filter:drop-shadow(0 0 8px rgba(255,0,85,0.9));" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      `;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }

    function onFollowEvent(user) {
      const u = String(user || 'Viewer').replace(/^@/, '');
      mcState.lastFollower = '@' + u;
      hudLastFollower.textContent = '@' + u;
      triggerToast('follow', u, '🐺 ¡Nuevo Seguidor! Lobo Guardián invocado');
    }

    function onLikeEvent(user, count = 1) {
      const u = String(user || 'Viewer').replace(/^@/, '');
      const c = Number(count) || 1;
      totalLikes += c;
      likesCycle += c;

      hudHeartGoalSvg.classList.remove('heart-pop-burst');
      void hudHeartGoalSvg.offsetWidth;
      hudHeartGoalSvg.classList.add('heart-pop-burst');
      spawnFloatingHeart();

      if (likesCycle >= 50) {
        triggerToast('like', u, '❤️ ¡Meta de 50 Likes Alcanzada! Impulso activado');
        likesCycle = likesCycle % 50;
      }

      likesCurrentCycleEl.textContent = likesCycle;
    }

    function onGiftEvent(user, giftName, coins = 1) {
      const u = String(user || 'Donador').replace(/^@/, '');
      triggerToast('gift', u, `${giftName} (${coins} 🪙)`);

      const g = String(giftName || '').toLowerCase().trim();
      if (g) {
        document.querySelectorAll('.mc-item-node').forEach(node => {
          const gn = node.getAttribute('data-gift-name') || '';
          if (gn && (gn === g || g.includes(gn) || gn.includes(g))) {
            node.style.transform = 'scale(1.18)';
            node.style.borderColor = 'var(--neon-gold)';
            setTimeout(() => {
              node.style.transform = '';
              node.style.borderColor = '';
            }, 700);
          }
        });
      }
    }

    function applyServerPayload(d) {
      if (!d) return;
      if (d.duel && d.duel.gift_scale) {
        mcRoot.style.setProperty('--ui-scale', (d.duel.gift_scale / 100).toFixed(2));
      }
      if (d.mc_overlay) {
        mcState = { ...mcState, ...d.mc_overlay };
        renderOverlay();
      }
      if (d.type === 'follow' || d.event === 'follow') {
        const u = d.data?.user || d.data?.nickname || d.user || 'Viewer';
        onFollowEvent(u);
      } else if (d.type === 'like' || d.event === 'like') {
        const u = d.data?.user || d.data?.nickname || d.user || 'Viewer';
        const c = d.data?.count || d.count || 1;
        onLikeEvent(u, c);
      } else if (d.type === 'gift' && d.data) {
        onGiftEvent(d.data.user, d.data.title, d.data.coins || 1);
      } else if (d.type === 'tiktok_event') {
        if (d.event === 'follow') {
          onFollowEvent(d.data?.nickname || d.data?.uniqueId || 'Viewer');
        } else if (d.event === 'like') {
          onLikeEvent(d.data?.nickname || d.data?.uniqueId || 'Viewer', d.data?.likeCount || 1);
        } else if (d.event === 'gift') {
          onGiftEvent(d.data?.nickname || d.data?.uniqueId || 'Donador', d.data?.giftName || 'Regalo', d.data?.diamondCount || 1);
        }
      }
    }

    renderOverlay();

    fetch('/api/estado')
      .then(r => r.json())
      .then(d => applyServerPayload(d))
      .catch(() => {});

    const evt = new EventSource('/api/eventos');
    evt.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        applyServerPayload(d);
      } catch (err) {}
    };
  </script>
</body>
</html>
