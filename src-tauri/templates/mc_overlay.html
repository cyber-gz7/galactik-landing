<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Interactive Overlay - Galactic Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700;800&display=swap');

    :root {
      --ui-scale: 1;
      --neon-cyan: #00f0ff;
      --neon-blue: #0088ff;
      --neon-red: #ff2a5f;
      --neon-gold: #ffe600;
      --neon-pink: #ff2a85;
      --bg-glass: rgba(6, 14, 28, 0.82);
      --border-glass: rgba(0, 240, 255, 0.35);
    }

    body[data-theme="SOL"] {
      --neon-cyan: #ffcc00;
      --neon-blue: #ff6600;
      --neon-red: #ff2200;
      --neon-gold: #ffff66;
      --bg-glass: rgba(28, 12, 4, 0.88);
      --border-glass: rgba(255, 180, 0, 0.4);
    }

    body[data-theme="NEON"] {
      --neon-cyan: #00f0ff;
      --neon-blue: #b000ff;
      --neon-red: #ff0077;
      --neon-gold: #00ffff;
      --bg-glass: rgba(14, 4, 28, 0.85);
      --border-glass: rgba(255, 0, 150, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
      pointer-events: none;
    }

    #mc-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 18px;
      transform: scale(var(--ui-scale, 1));
      transform-origin: top center;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    /* BARRA SUPERIOR DE ESTADO MODULAR */
    .mc-topbar-hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      z-index: 10;
    }

    .hud-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), 0 0 16px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-pill.malos {
      border-color: rgba(255, 42, 95, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), 0 0 16px rgba(255, 42, 95, 0.2);
    }

    .hud-pill.pill-follow {
      border-color: rgba(0, 240, 255, 0.5);
    }

    .hud-pill.pill-likes {
      border-color: rgba(255, 42, 133, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), 0 0 16px rgba(255, 42, 133, 0.2);
    }

    .hud-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
    }

    .svg-icon {
      display: block;
      width: 20px;
      height: 20px;
    }

    .svg-follow {
      color: var(--neon-cyan);
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.8));
    }

    .svg-heart {
      filter: drop-shadow(0 0 6px rgba(255, 42, 133, 0.8));
      transform-origin: center center;
    }

    .svg-shield {
      color: var(--neon-gold);
      filter: drop-shadow(0 0 6px rgba(255, 230, 0, 0.6));
    }

    .heart-pulse {
      animation: heartBeat 1.2s ease-in-out infinite;
    }

    .heart-pop {
      animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.18); }
      40% { transform: scale(0.96); }
      60% { transform: scale(1.12); }
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.45); }
      100% { transform: scale(1); }
    }

    .hud-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #9cb3c9;
      text-transform: uppercase;
    }

    .hud-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
    }

    .pill-follow .hud-value {
      color: var(--neon-cyan);
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-likes .hud-value {
      color: #ff5599;
    }

    /* BARRA DE TÓTEMS */
    .totem-progress-bar {
      width: 110px;
      height: 8px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .totem-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0088ff, #00f0ff, #ffe600);
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-pill.malos .totem-bar-fill {
      background: linear-gradient(90deg, #990022, #ff2a5f, #ff9100);
    }

    /* CONTENEDOR MODULAR DE REGALOS (CAROUSEL / FLAT / STATIC) */
    .layout-carousel {
      width: min(96vw, 780px);
      overflow: hidden;
      position: relative;
      padding: 8px 0;
      mask-image: linear-gradient(90deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
    }

    .carousel-track {
      display: flex;
      gap: 12px;
      width: max-content;
      animation: carouselScroll 26s linear infinite;
      will-change: transform;
    }

    @keyframes carouselScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .mc-card {
      width: 136px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-shrink: 0;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }

    .mc-card.malos {
      border-color: rgba(255, 42, 95, 0.45);
    }

    .mc-card-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.8));
      margin-bottom: 6px;
    }

    .mc-card-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 1px 1px 0 #000;
      line-height: 1.15;
      margin-bottom: 4px;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mc-card.malos .mc-card-action {
      color: #ff6b8b;
    }

    .mc-card-giftname {
      font-size: 11px;
      font-weight: 700;
      color: #e2f4ff;
      opacity: 0.92;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .mc-card-coins {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      color: var(--neon-gold);
      background: rgba(255, 230, 0, 0.12);
      border: 1px solid rgba(255, 230, 0, 0.35);
      padding: 2px 7px;
      border-radius: 99px;
    }

    /* ESTILO PLANO / FLAT */
    .layout-flat {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: 96vw;
    }

    .flat-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(10, 24, 42, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 10px;
      padding: 4px 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .flat-pill.malos {
      border-color: rgba(255, 42, 95, 0.4);
    }

    .flat-icon {
      width: 30px;
      height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    }

    .flat-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .flat-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--neon-cyan);
    }

    .flat-pill.malos .flat-action {
      color: #ff6b8b;
    }

    .flat-coins {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--neon-gold);
    }

    /* ESTILO ESTÁTICO / GRID */
    .layout-static {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(124px, 1fr));
      gap: 10px;
      width: min(96vw, 740px);
    }

    .layout-static .mc-card {
      width: 100%;
    }

    /* NOTIFICACIÓN EMERGENTE (TOAST DE EVENTOS SVG) */
    .mc-event-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px) scale(0.9);
      background: rgba(4, 12, 24, 0.94);
      border: 2px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 240, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .mc-event-toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .mc-event-toast.toast-follow {
      border-color: var(--neon-cyan);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 240, 255, 0.4);
    }

    .mc-event-toast.toast-like {
      border-color: #ff2a85;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 42, 133, 0.4);
    }

    .toast-icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    .toast-user {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }

    .toast-like .toast-user {
      color: #ff73a9;
      text-shadow: 0 0 8px rgba(255, 42, 133, 0.5);
    }

    .toast-desc {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
    }

    /* CORAZONES FLOTANTES ACELERADOS POR GPU */
    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      animation: floatUpFade 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--rnd-x, 0px), -120px, 0) scale(1.3);
      }
    }
  </style>
</head>
<body>
  <div id="mc-root">
    <!-- BARRA SUPERIOR DE ESTADO MODULAR -->
    <header class="mc-topbar-hud" id="topbar-hud">
      <!-- HUD Tótems & Facción -->
      <div class="hud-pill" id="hud-faction-pill">
        <div class="hud-icon-wrap">
          <!-- Escudo SVG -->
          <svg class="svg-icon svg-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="hud-label" id="hud-faction">FACCIÓN: BUENOS</span>
        <div class="totem-progress-bar">
          <div class="totem-bar-fill" id="hud-totem-fill" style="width: 50%;"></div>
        </div>
        <span class="hud-value" id="hud-totem-num">10 / 20</span>
      </div>

      <!-- Badge Seguidor SVG (Persona con +) -->
      <div class="hud-pill pill-follow" id="hud-follow-pill">
        <div class="hud-icon-wrap">
          <svg class="svg-icon svg-follow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
        </div>
        <span class="hud-label">FOLLOW:</span>
        <span class="hud-value" id="hud-last-follower">@Streamer</span>
      </div>

      <!-- Badge Likes SVG (Corazón estilizado) -->
      <div class="hud-pill pill-likes" id="hud-likes-pill">
        <div class="hud-icon-wrap">
          <svg class="svg-icon svg-heart heart-pulse" id="hud-heart-svg" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="heartGradHud" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff2a85"/>
                <stop offset="100%" stop-color="#ff7300"/>
              </linearGradient>
            </defs>
            <path fill="url(#heartGradHud)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <span class="hud-label">LIKES:</span>
        <span class="hud-value" id="hud-total-likes">0</span>
      </div>
    </header>

    <!-- Contenedor dinámico según estilo (carousel | static | flat) -->
    <main id="mc-content-container"></main>
  </div>

  <!-- TOAST DE EVENTOS SVG -->
  <aside class="mc-event-toast" id="mc-event-toast" aria-live="polite">
    <div class="toast-icon-box" id="toast-icon-box">
      <!-- Icono SVG inyectado dinámicamente -->
    </div>
    <div>
      <div class="toast-user" id="toast-user">@Usuario</div>
      <div class="toast-desc" id="toast-desc">¡Acción Activada!</div>
    </div>
  </aside>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pathName = window.location.pathname.toLowerCase();

    function detectInitialStyle() {
      if (urlParams.get('style')) return urlParams.get('style');
      if (pathName.includes('estatico') || pathName.includes('static')) return 'static';
      if (pathName.includes('plano') || pathName.includes('flat')) return 'flat';
      return 'carousel';
    }

    let mcState = {
      style: detectInitialStyle(),
      showTotems: true,
      totems: 10,
      maxTotems: 20,
      faction: 'BUENOS',
      lastFollower: 'En espera...',
      totalLikes: 0,
      items: [
        { id: '1', gift_name: 'Rosa', icon_file: 'rose-1-coins.webp', coins: 1, action_label: 'Zombie', faction: 'MALOS' },
        { id: '2', gift_name: 'GG', icon_file: 'gg-1-coins.webp', coins: 5, action_label: 'Creeper', faction: 'MALOS' },
        { id: '3', gift_name: 'Heart Me', icon_file: 'heart-me-1-coins.webp', coins: 1, action_label: '+1 Tótem', faction: 'BUENOS' },
        { id: '4', gift_name: 'Doughnut', icon_file: 'doughnut-30-coins.webp', coins: 30, action_label: 'Lluvia TNT', faction: 'MALOS' },
        { id: '5', gift_name: 'Capybara', icon_file: 'capybara-30-coins.webp', coins: 30, action_label: '5 Diamantes', faction: 'BUENOS' },
        { id: '6', gift_name: 'Game Controller', icon_file: 'game-controller-100-coins.webp', coins: 100, action_label: 'Warden Boss', faction: 'MALOS' },
        { id: '7', gift_name: 'Galaxy', icon_file: 'galaxy-1000-coins.webp', coins: 1000, action_label: 'Arcángel Solar', faction: 'BUENOS' },
        { id: '8', gift_name: 'Lion', icon_file: 'lion-29999-coins.webp', coins: 29999, action_label: 'La Parka Final', faction: 'MALOS' }
      ]
    };

    const container = document.getElementById('mc-content-container');
    const hudFactionPill = document.getElementById('hud-faction-pill');
    const hudFaction = document.getElementById('hud-faction');
    const hudTotemFill = document.getElementById('hud-totem-fill');
    const hudTotemNum = document.getElementById('hud-totem-num');
    const hudLastFollower = document.getElementById('hud-last-follower');
    const hudTotalLikes = document.getElementById('hud-total-likes');
    const hudHeartSvg = document.getElementById('hud-heart-svg');
    const eventToast = document.getElementById('mc-event-toast');
    const toastIconBox = document.getElementById('toast-icon-box');
    const toastUser = document.getElementById('toast-user');
    const toastDesc = document.getElementById('toast-desc');
    const mcRoot = document.getElementById('mc-root');

    const SVG_FOLLOW_ICON = `
      <svg class="svg-icon svg-follow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="8.5" cy="7" r="4"/>
        <line x1="20" y1="8" x2="20" y2="14"/>
        <line x1="23" y1="11" x2="17" y2="11"/>
      </svg>
    `;

    const SVG_HEART_ICON = `
      <svg class="svg-icon svg-heart" viewBox="0 0 24 24">
        <defs>
          <linearGradient id="heartGradToast" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff2a85"/>
            <stop offset="100%" stop-color="#ff7300"/>
          </linearGradient>
        </defs>
        <path fill="url(#heartGradToast)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    `;

    const SVG_GIFT_ICON = `
      <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="#ffe600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 12 20 22 4 22 4 12"/>
        <rect x="2" y="7" width="20" height="5"/>
        <line x1="12" y1="22" x2="12" y2="7"/>
        <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
        <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
      </svg>
    `;

    function cleanGiftPath(raw) {
      if (!raw) return '/gifts/default-gift.svg';
      const s = String(raw).trim();
      if (s.startsWith('http://') || s.startsWith('https://')) return s;
      const clean = s.replace(/^(\.?\/)?gifts\//i, '');
      return `/gifts/${clean || 'default-gift.svg'}`;
    }

    function renderOverlay() {
      hudFactionPill.style.display = mcState.showTotems !== false ? 'flex' : 'none';
      hudFactionPill.className = 'hud-pill ' + (mcState.faction === 'MALOS' ? 'malos' : 'buenos');
      hudFaction.textContent = 'FACCIÓN: ' + mcState.faction;
      const pct = Math.max(0, Math.min(100, (mcState.totems / (mcState.maxTotems || 20)) * 100));
      hudTotemFill.style.width = pct + '%';
      hudTotemNum.textContent = `${mcState.totems} / ${mcState.maxTotems || 20}`;
      hudLastFollower.textContent = mcState.lastFollower || '@Streamer';
      hudTotalLikes.textContent = Number(mcState.totalLikes || 0).toLocaleString();

      const items = Array.isArray(mcState.items) && mcState.items.length > 0 ? mcState.items : [];
      const activeStyle = urlParams.get('style') || (
        pathName.includes('estatico') ? 'static' :
        pathName.includes('plano') ? 'flat' :
        mcState.style || 'carousel'
      );

      if (activeStyle === 'flat') {
        container.className = 'layout-flat';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          return `
            <div class="flat-pill mc-item-node ${item.faction === 'MALOS' ? 'malos' : 'buenos'}" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <img src="${gSrc}" class="flat-icon" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/default-gift.svg';" />
              <div class="flat-meta">
                <span class="flat-action">${item.action_label || item.gift_name}</span>
                <span class="flat-coins">${item.gift_name} • ${item.coins} Diamantes</span>
              </div>
            </div>
          `;
        }).join('');
      } else if (activeStyle === 'static') {
        container.className = 'layout-static';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          return `
            <div class="mc-card mc-item-node ${item.faction === 'MALOS' ? 'malos' : 'buenos'}" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <img src="${gSrc}" class="mc-card-img" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/default-gift.svg';" />
              <div class="mc-card-action">${item.action_label || item.gift_name}</div>
              <div class="mc-card-giftname">${item.gift_name}</div>
              <div class="mc-card-coins">${item.coins} Diamantes</div>
            </div>
          `;
        }).join('');
      } else {
        const loopItems = [...items, ...items];
        container.className = 'layout-carousel';
        container.innerHTML = `<div class="carousel-track">` + loopItems.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          return `
            <div class="mc-card mc-item-node ${item.faction === 'MALOS' ? 'malos' : 'buenos'}" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <img src="${gSrc}" class="mc-card-img" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/default-gift.svg';" />
              <div class="mc-card-action">${item.action_label || item.gift_name}</div>
              <div class="mc-card-giftname">${item.gift_name}</div>
              <div class="mc-card-coins">${item.coins} Diamantes</div>
            </div>
          `;
        }).join('') + `</div>`;
      }
    }

    let toastTimeout = null;
    function triggerToast(type, user, desc) {
      clearTimeout(toastTimeout);
      eventToast.className = 'mc-event-toast show ' + (type === 'follow' ? 'toast-follow' : type === 'like' ? 'toast-like' : 'toast-gift');
      if (type === 'follow') {
        toastIconBox.innerHTML = SVG_FOLLOW_ICON;
      } else if (type === 'like') {
        toastIconBox.innerHTML = SVG_HEART_ICON;
      } else {
        toastIconBox.innerHTML = SVG_GIFT_ICON;
      }
      toastUser.textContent = '@' + String(user || 'Usuario').replace(/^@/, '');
      toastDesc.textContent = desc || '';
      toastTimeout = setTimeout(() => {
        eventToast.classList.remove('show');
      }, 3500);
    }

    function spawnFloatingHeart() {
      const h = document.createElement('div');
      h.className = 'floating-heart';
      const rect = hudHeartSvg.getBoundingClientRect();
      const x = rect.left + rect.width / 2 + (Math.random() * 24 - 12);
      const y = rect.top;
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      h.style.setProperty('--rnd-x', (Math.random() * 60 - 30) + 'px');
      h.innerHTML = SVG_HEART_ICON;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }

    function onFollowEvent(user) {
      const u = String(user || 'Viewer').replace(/^@/, '');
      mcState.lastFollower = '@' + u;
      hudLastFollower.textContent = '@' + u;
      triggerToast('follow', u, '¡Nuevo Seguidor en el Live!');
    }

    function onLikeEvent(user, count = 1) {
      const u = String(user || 'Viewer').replace(/^@/, '');
      const c = Number(count) || 1;
      mcState.totalLikes = (mcState.totalLikes || 0) + c;
      hudTotalLikes.textContent = mcState.totalLikes.toLocaleString();
      hudHeartSvg.classList.remove('heart-pop');
      void hudHeartSvg.offsetWidth;
      hudHeartSvg.classList.add('heart-pop');
      spawnFloatingHeart();
      if (c >= 15) {
        triggerToast('like', u, `¡Envió ${c} likes! ❤️`);
      }
    }

    function onGiftEvent(user, giftName, coins = 1) {
      const u = String(user || 'Donador').replace(/^@/, '');
      triggerToast('gift', u, `${giftName} (${coins} 💎)`);

      const g = String(giftName || '').toLowerCase().trim();
      if (g) {
        document.querySelectorAll('.mc-item-node').forEach(node => {
          const gn = node.getAttribute('data-gift-name') || '';
          if (gn && (gn === g || g.includes(gn) || gn.includes(g))) {
            node.style.transform = 'scale(1.18)';
            setTimeout(() => { node.style.transform = ''; }, 600);
          }
        });
      }
    }

    function applyServerPayload(d) {
      if (!d) return;
      if (d.duel && d.duel.gift_scale) {
        mcRoot.style.setProperty('--ui-scale', (d.duel.gift_scale / 100).toFixed(2));
      }
      if (d.mc_overlay) {
        mcState = { ...mcState, ...d.mc_overlay };
        renderOverlay();
      }
      if (d.type === 'follow' || d.event === 'follow') {
        const u = d.data?.user || d.data?.nickname || d.user || 'Viewer';
        onFollowEvent(u);
      } else if (d.type === 'like' || d.event === 'like') {
        const u = d.data?.user || d.data?.nickname || d.user || 'Viewer';
        const c = d.data?.count || d.count || 1;
        onLikeEvent(u, c);
      } else if (d.type === 'gift' && d.data) {
        onGiftEvent(d.data.user, d.data.title, d.data.coins || 1);
      } else if (d.type === 'tiktok_event') {
        if (d.event === 'follow') {
          onFollowEvent(d.data?.nickname || d.data?.uniqueId || 'Viewer');
        } else if (d.event === 'like') {
          onLikeEvent(d.data?.nickname || d.data?.uniqueId || 'Viewer', d.data?.likeCount || 1);
        } else if (d.event === 'gift') {
          onGiftEvent(d.data?.nickname || d.data?.uniqueId || 'Donador', d.data?.giftName || 'Regalo', d.data?.diamondCount || 1);
        }
      }
    }

    if (urlParams.get('theme')) {
      document.body.setAttribute('data-theme', urlParams.get('theme').toUpperCase());
    }

    renderOverlay();

    fetch('/api/estado')
      .then(r => r.json())
      .then(d => applyServerPayload(d))
      .catch(() => {});

    const evt = new EventSource('/api/eventos');
    evt.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        applyServerPayload(d);
      } catch (err) {}
    };
  </script>
</body>
</html>
