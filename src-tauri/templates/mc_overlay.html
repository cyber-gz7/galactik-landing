<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Interactive Overlay - Galactic Live by GZ7</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700;800&display=swap');

    :root {
      --ui-scale: 1;
      --neon-cyan: #00f0ff;
      --neon-blue: #0099ff;
      --neon-red: #ff2a5f;
      --neon-gold: #ffe600;
      --bg-glass: rgba(4, 10, 22, 0.86);
    }

    body[data-theme="SOL"] {
      --neon-cyan: #ffcc00;
      --neon-blue: #ff5500;
      --neon-red: #ff2200;
      --neon-gold: #ffff88;
      --bg-glass: rgba(28, 10, 2, 0.9);
    }

    body[data-theme="CONTRASTE"] {
      --neon-cyan: #00ffff;
      --neon-blue: #ffffff;
      --neon-red: #ff2a5f;
      --neon-gold: #ffee00;
      --bg-glass: rgba(0, 0, 0, 0.95);
    }

    body[data-theme="MOVIMIENTO"] {
      --neon-cyan: #00ffa3;
      --neon-blue: #00f0ff;
      --neon-red: #ff2a85;
      --neon-gold: #ffe600;
      --bg-glass: rgba(10, 8, 28, 0.88);
    }

    body[data-theme="NEON"] {
      --neon-cyan: #00f0ff;
      --neon-blue: #ff00aa;
      --neon-red: #ff00aa;
      --neon-gold: #00ffff;
      --bg-glass: rgba(8, 3, 24, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
      pointer-events: none;
    }

    #mc-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 18px;
      transform: scale(var(--ui-scale, 1));
      transform-origin: top center;
      transition: transform 0.25s ease;
    }

    /* BARRA SUPERIOR DE TÓTEMS & FACCIÓN */
    .mc-totem-hud {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-glass);
      border: 2px solid var(--neon-cyan);
      border-radius: 999px;
      padding: 6px 20px;
      margin-bottom: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.85), 0 0 20px rgba(0, 240, 255, 0.28);
      backdrop-filter: blur(10px);
    }

    .mc-totem-hud.malos {
      border-color: var(--neon-red);
      box-shadow: 0 6px 24px rgba(0,0,0,0.85), 0 0 20px rgba(255, 42, 95, 0.3);
    }

    .faction-pill {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(0, 240, 255, 0.18);
      color: var(--neon-cyan);
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .mc-totem-hud.malos .faction-pill {
      background: rgba(255, 42, 95, 0.2);
      color: var(--neon-red);
      text-shadow: 0 0 8px rgba(255, 42, 95, 0.6);
    }

    .totem-progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .totem-bar-bg {
      width: 150px;
      height: 10px;
      background: rgba(0,0,0,0.75);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .totem-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #0088ff, #00f0ff, #ffe600);
      transition: width 0.35s ease;
    }

    .mc-totem-hud.malos .totem-bar-fill {
      background: linear-gradient(90deg, #990022, #ff2a5f, #ff9100);
    }

    .totem-numbers {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
    }

    /* ================= ESTILO 1: CARRUSEL DINÁMICO ================= */
    .layout-carousel {
      width: min(96vw, 760px);
      overflow: hidden;
      position: relative;
      padding: 10px 0;
      mask-image: linear-gradient(90deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
    }

    .carousel-track {
      display: flex;
      gap: 14px;
      width: max-content;
      animation: carouselScroll 24s linear infinite;
    }

    @keyframes carouselScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .mc-card {
      width: 142px;
      background: var(--bg-glass);
      border: 1.5px solid rgba(0, 240, 255, 0.42);
      border-radius: 16px;
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.12);
      position: relative;
      flex-shrink: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .mc-card.malos {
      border-color: rgba(255, 42, 95, 0.5);
    }

    .mc-card-img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.85));
      margin-bottom: 6px;
    }

    .mc-card-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 1.5px 1.5px 0 #000;
      line-height: 1.2;
      margin-bottom: 4px;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mc-card.malos .mc-card-action {
      color: #ff6b8b;
    }

    .mc-card-giftname {
      font-size: 12px;
      font-weight: 700;
      color: #d8f4ff;
      opacity: 0.9;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .mc-card-coins {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: var(--neon-gold);
      background: rgba(255, 230, 0, 0.14);
      border: 1px solid rgba(255, 230, 0, 0.4);
      padding: 2px 8px;
      border-radius: 99px;
    }

    /* ================= ESTILO 2: ESTÁTICO (CUADRÍCULA COMPACTA) ================= */
    .layout-static {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 10px;
      width: min(96vw, 720px);
    }

    .layout-static .mc-card {
      width: 100%;
    }

    /* ================= ESTILO 3: PLANO / RECTO (BARRA LIMPIA FÁCIL DE USAR) ================= */
    .layout-flat {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(4, 10, 22, 0.9);
      border: 2px solid rgba(0, 240, 255, 0.5);
      border-radius: 14px;
      padding: 8px 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.9), 0 0 22px rgba(0, 240, 255, 0.22);
      max-width: 96vw;
    }

    .flat-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(10, 24, 42, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.32);
      border-radius: 10px;
      padding: 5px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .flat-pill.malos {
      border-color: rgba(255, 42, 95, 0.42);
    }

    .flat-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    .flat-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .flat-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 1px 1px 0 #000;
    }

    .flat-pill.malos .flat-action {
      color: #ff6b8b;
    }

    .flat-coins {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--neon-gold);
    }

    /* ALERTA EMERGENTE EN EL OVERLAY MINECRAFT */
    .mc-trigger-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(4, 12, 26, 0.95);
      border: 2px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 50;
    }

    .mc-trigger-toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
  </style>
</head>
<body>
  <div id="mc-root">
    <!-- Barra de Tótems -->
    <div class="mc-totem-hud" id="totem-hud">
      <span class="faction-pill" id="hud-faction">FACCIÓN: BUENOS</span>
      <div class="totem-progress-wrap">
        <div class="totem-bar-bg">
          <div class="totem-bar-fill" id="hud-totem-fill" style="width: 50%;"></div>
        </div>
        <span class="totem-numbers" id="hud-totem-num">10 / 20 🛡️</span>
      </div>
    </div>

    <!-- Contenedor dinámico según estilo (carousel | static | flat) -->
    <div id="mc-content-container"></div>
  </div>

  <div class="mc-trigger-toast" id="mc-toast">
    <span style="font-size: 28px;">⚡</span>
    <div>
      <div id="mc-toast-user" style="font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;color:#00f0ff;">@Donador</div>
      <div id="mc-toast-action" style="font-size:15px;font-weight:800;color:#ffe600;">¡Invocó Acción en Minecraft!</div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pathName = window.location.pathname.toLowerCase();

    function detectInitialStyle() {
      if (urlParams.get('style')) return urlParams.get('style');
      if (pathName.includes('estatico') || pathName.includes('static')) return 'static';
      if (pathName.includes('plano') || pathName.includes('flat')) return 'flat';
      return 'carousel';
    }

    let mcState = {
      style: detectInitialStyle(),
      showTotems: true,
      totems: 10,
      maxTotems: 20,
      faction: 'BUENOS',
      items: [
        { id: '1', gift_name: 'Rosa', icon_file: 'rose-1-coins.webp', coins: 1, action_label: '🧟 Zombie', faction: 'MALOS' },
        { id: '2', gift_name: 'GG', icon_file: 'gg-1-coins.webp', coins: 5, action_label: '💣 Creeper', faction: 'MALOS' },
        { id: '3', gift_name: 'Heart Me', icon_file: 'heart-me-1-coins.webp', coins: 1, action_label: '🛡️ +1 Tótem', faction: 'BUENOS' },
        { id: '4', gift_name: 'Doughnut', icon_file: 'doughnut-30-coins.webp', coins: 30, action_label: '💥 Lluvia TNT', faction: 'MALOS' },
        { id: '5', gift_name: 'Capybara', icon_file: 'capybara-30-coins.webp', coins: 30, action_label: '💎 5 Diamantes', faction: 'BUENOS' },
        { id: '6', gift_name: 'Game Controller', icon_file: 'game-controller-100-coins.webp', coins: 100, action_label: '👹 Warden Boss', faction: 'MALOS' },
        { id: '7', gift_name: 'Galaxy', icon_file: 'galaxy-1000-coins.webp', coins: 1000, action_label: '👼 Arcángel Solar', faction: 'BUENOS' },
        { id: '8', gift_name: 'Lion', icon_file: 'lion-29999-coins.webp', coins: 29999, action_label: '💀 La Parka Final', faction: 'MALOS' }
      ]
    };

    const AUDIO_ENABLED = urlParams.get('audio') === '1';
    let overlayAudioEl = null;

    function playOverlayAudio(rawUrl, vol = 1.0) {
      if (!AUDIO_ENABLED || !rawUrl) return;
      try {
        if (overlayAudioEl) {
          overlayAudioEl.pause();
          overlayAudioEl = null;
        }
        let cleanUrl = String(rawUrl).trim();
        if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://') && !cleanUrl.startsWith('data:') && !cleanUrl.startsWith('/')) {
          cleanUrl = '/' + cleanUrl.replace(/^\.\//, '');
        }
        overlayAudioEl = new Audio(cleanUrl);
        overlayAudioEl.volume = Math.max(0, Math.min(1, Number(vol) || 1.0));
        overlayAudioEl.play().catch(() => {});
      } catch (e) {}
    }

    const container = document.getElementById('mc-content-container');
    const totemHud = document.getElementById('totem-hud');
    const hudFaction = document.getElementById('hud-faction');
    const hudTotemFill = document.getElementById('hud-totem-fill');
    const hudTotemNum = document.getElementById('hud-totem-num');
    const mcRoot = document.getElementById('mc-root');

    function cleanGiftPath(raw) {
      if (!raw) return '/gifts/rose-1-coins.webp';
      const s = String(raw).trim();
      if (s.startsWith('http://') || s.startsWith('https://')) return s;
      const clean = s.replace(/^(\.?\/)?gifts\//i, '');
      return `/gifts/${clean || 'rose-1-coins.webp'}`;
    }

    function renderOverlay() {
      totemHud.style.display = mcState.showTotems !== false ? 'flex' : 'none';
      totemHud.className = 'mc-totem-hud ' + (mcState.faction === 'MALOS' ? 'malos' : 'buenos');
      hudFaction.textContent = 'FACCIÓN: ' + mcState.faction;
      const pct = Math.max(0, Math.min(100, (mcState.totems / (mcState.maxTotems || 20)) * 100));
      hudTotemFill.style.width = pct + '%';
      hudTotemNum.textContent = `${mcState.totems} / ${mcState.maxTotems || 20} 🛡️`;

      const items = Array.isArray(mcState.items) && mcState.items.length > 0 ? mcState.items : [];
      const activeStyle = urlParams.get('style') || (
        pathName.includes('estatico') ? 'static' :
        pathName.includes('plano') ? 'flat' :
        mcState.style || 'carousel'
      );

      if (activeStyle === 's2e') {
        container.className = 'layout-flat';
        container.style.background = '#ffffff';
        container.style.border = '2px solid rgba(0,240,255,0.6)';
        container.style.padding = '10px 16px';
        container.innerHTML = items.slice(0, 12).map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const mSrc = item.action_image || gSrc;
          const rep = item.repetition || 1;
          return `
            <div class="mc-item-node" data-gift-name="${(item.gift_name || '').toLowerCase()}" data-sound-url="${item.sound_url || ''}" style="display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:66px;padding:4px 6px;color:#111;transition:transform 0.25s ease;">
              <div style="font-family:'JetBrains Mono',monospace;font-weight:900;font-size:14px;color:#111;margin-bottom:4px;">${rep}x</div>
              <img src="${mSrc}" style="width:52px;height:52px;object-fit:contain;margin-bottom:6px;image-rendering:-webkit-optimize-contrast;" onerror="this.src='/gifts/rose-1-coins.webp'" />
              <img src="${gSrc}" style="width:38px;height:38px;object-fit:contain;image-rendering:-webkit-optimize-contrast;" onerror="this.src='/gifts/rose-1-coins.webp'" />
            </div>
          `;
        }).join('');
      } else if (activeStyle === 'flat') {
        container.className = 'layout-flat';
        container.style.background = '';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const sndIcon = (item.sound_name || item.sound_url) ? ' 🔊' : '';
          return `
            <div class="flat-pill mc-item-node ${item.faction === 'MALOS' ? 'malos' : 'buenos'}" data-gift-name="${(item.gift_name || '').toLowerCase()}" data-sound-url="${item.sound_url || ''}">
              <img src="${gSrc}" class="flat-icon" style="image-rendering:-webkit-optimize-contrast;" onerror="this.src='/gifts/rose-1-coins.webp'" />
              <div class="flat-meta">
                <span class="flat-action">${item.action_label || item.gift_name}${sndIcon}</span>
                <span class="flat-coins">${item.gift_name} • ${item.coins} 💎</span>
              </div>
            </div>
          `;
        }).join('');
      } else if (activeStyle === 'static') {
        container.className = 'layout-static';
        container.style.background = '';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const sndIcon = (item.sound_name || item.sound_url) ? ' 🔊' : '';
          return `
            <div class="mc-card mc-item-node ${item.faction === 'MALOS' ? 'malos' : 'buenos'}" data-gift-name="${(item.gift_name || '').toLowerCase()}" data-sound-url="${item.sound_url || ''}">
              <img src="${gSrc}" class="mc-card-img" style="image-rendering:-webkit-optimize-contrast;" onerror="this.src='/gifts/rose-1-coins.webp'" />
              <div class="mc-card-action">${item.action_label || item.gift_name}</div>
              <div class="mc-card-giftname">${item.gift_name}${sndIcon}</div>
              <div class="mc-card-coins">${item.coins} 💎</div>
            </div>
          `;
        }).join('');
      } else {
        const loopItems = [...items, ...items];
        container.className = 'layout-carousel';
        container.style.background = '';
        container.innerHTML = `<div class="carousel-track">` + loopItems.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const sndIcon = (item.sound_name || item.sound_url) ? ' 🔊' : '';
          return `
            <div class="mc-card mc-item-node ${item.faction === 'MALOS' ? 'malos' : 'buenos'}" data-gift-name="${(item.gift_name || '').toLowerCase()}" data-sound-url="${item.sound_url || ''}">
              <img src="${gSrc}" class="mc-card-img" style="image-rendering:-webkit-optimize-contrast;" onerror="this.src='/gifts/rose-1-coins.webp'" />
              <div class="mc-card-action">${item.action_label || item.gift_name}</div>
              <div class="mc-card-giftname">${item.gift_name}${sndIcon}</div>
              <div class="mc-card-coins">${item.coins} 💎</div>
            </div>
          `;
        }).join('') + `</div>`;
      }
    }

    let toastTimer = null;
    function showTriggerToast(user, title, rawGiftTitle, eventSoundUrl) {
      const toast = document.getElementById('mc-toast');
      document.getElementById('mc-toast-user').textContent = '@' + String(user || 'Donador').replace(/^@/, '');
      document.getElementById('mc-toast-action').textContent = title || '¡Evento Activado!';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);

      let matchedSoundUrl = eventSoundUrl || '';
      const g = String(rawGiftTitle || '').toLowerCase().trim();
      if (g) {
        document.querySelectorAll('.mc-item-node').forEach(node => {
          const gn = node.getAttribute('data-gift-name') || '';
          if (gn && (gn === g || g.includes(gn) || gn.includes(g))) {
            node.style.transform = 'scale(1.16)';
            setTimeout(() => { node.style.transform = ''; }, 550);
            if (!matchedSoundUrl && node.getAttribute('data-sound-url')) {
              matchedSoundUrl = node.getAttribute('data-sound-url');
            }
          }
        });
      }
      if (matchedSoundUrl) {
        playOverlayAudio(matchedSoundUrl, 1.0);
      }
    }

    if (urlParams.get('theme')) {
      document.body.setAttribute('data-theme', urlParams.get('theme').toUpperCase());
    }

    function applyServerPayload(d) {
      if (!d) return;
      if (d.duel && d.duel.gift_scale) {
        mcRoot.style.setProperty('--ui-scale', (d.duel.gift_scale / 100).toFixed(2));
      }
      if (!urlParams.get('theme')) {
        const theme = d.mc_overlay?.theme_style || d.gift_vs_gift?.theme_style;
        if (theme) document.body.setAttribute('data-theme', String(theme).toUpperCase());
      }
      if (d.mc_overlay) {
        mcState = { ...mcState, ...d.mc_overlay };
        renderOverlay();
      }
      if (d.type === 'gift' && d.data) {
        showTriggerToast(
          d.data.user,
          `${d.data.title} (${d.data.coins || 1} 💎)`,
          d.data.title,
          d.data.sound_url || d.data.audio_url || ''
        );
      }
    }

    renderOverlay();

    fetch('/api/estado')
      .then(r => r.json())
      .then(d => applyServerPayload(d))
      .catch(() => {});

    const evt = new EventSource('/api/eventos');
    evt.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        applyServerPayload(d);
      } catch (err) {}
    };
  </script>
</body>
</html>
