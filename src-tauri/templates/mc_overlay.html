<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Interactive Overlay - GALACTK PANEL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700;800&display=swap');

    :root {
      --ui-scale: 1;
      --carousel-speed: 28s;
      --ui-font-size: 11.5px;
      --bg-glass-alpha: 0.72;
      --neon-cyan: #00f0ff;
      --neon-blue: #0088ff;
      --neon-gold: #ffe600;
      --neon-pink: #ff2a85;
      --neon-orange: #ff6600;
      --bg-glass: rgba(8, 14, 24, var(--bg-glass-alpha, 0.72));
      --border-glass: rgba(0, 240, 255, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
      pointer-events: none;
    }

    #mc-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 16px;
      transform: scale(var(--ui-scale, 1));
      transform-origin: top center;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      background: transparent !important;
    }

    /* BARRA SUPERIOR DE ESTADO SIN FACCIONES */
    .mc-topbar-hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      z-index: 10;
    }

    .hud-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 999px;
      padding: 6px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 14px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* BADGE CORAZÓN VECTORIAL SVG CON 50 EN EL CENTRO */
    .pill-likes-goal {
      border-color: rgba(255, 42, 133, 0.6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 16px rgba(255, 42, 133, 0.3);
      padding: 4px 14px 4px 8px;
    }

    .hud-heart-wrapper {
      width: 38px;
      height: 38px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .svg-heart-goal {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px rgba(255, 0, 100, 0.8));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .heart-pulse-active {
      animation: heartBeatGoal 1.1s ease-in-out infinite;
    }

    .heart-pop-burst {
      animation: heartPopBurst 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.4);
    }

    @keyframes heartBeatGoal {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.15); }
      40% { transform: scale(0.98); }
      60% { transform: scale(1.1); }
    }

    @keyframes heartPopBurst {
      0% { transform: scale(1); }
      50% { transform: scale(1.35) rotate(-5deg); }
      100% { transform: scale(1); }
    }

    .likes-goal-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .likes-goal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 800;
      color: #ff5599;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .likes-goal-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 1px 2px #000;
    }

    /* BADGE SEGUIDOR */
    .pill-follow {
      border-color: rgba(0, 240, 255, 0.55);
    }

    .svg-follow {
      width: 20px;
      height: 20px;
      color: var(--neon-cyan);
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.8));
    }

    .hud-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #9cb3c9;
      text-transform: uppercase;
    }

    .hud-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-follow .hud-value {
      color: var(--neon-cyan);
    }

    /* BADGE TÓTEMS STACKEABLES (UNIFICADO) */
    .pill-totems-stack {
      border-color: rgba(255, 230, 0, 0.55);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 14px rgba(255, 230, 0, 0.2);
    }

    .svg-totem-icon {
      width: 22px;
      height: 22px;
      filter: drop-shadow(0 0 6px rgba(255, 230, 0, 0.8));
    }

    .pill-totems-stack .hud-value {
      color: var(--neon-gold);
    }

    /* CONTENEDOR MODULAR DE REGALOS (CAROUSEL / FLAT / STATIC) */
    .layout-carousel {
      width: min(96vw, 840px);
      overflow: hidden;
      position: relative;
      padding: 10px 0;
      mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 6%, #000 94%, transparent 100%);
      background: transparent !important;
    }

    .carousel-track {
      display: flex;
      gap: 14px;
      width: max-content;
      animation: carouselScroll var(--carousel-speed, 28s) linear infinite;
      will-change: transform;
    }

    .carousel-track:hover {
      animation-play-state: paused;
    }

    @keyframes carouselScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* TARJETA DE EVENTO / PLUGIN ILUSTRADA */
    .mc-card {
      width: 144px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-shrink: 0;
      position: relative;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }

    .mc-card:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: var(--neon-cyan);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8), 0 0 18px rgba(0, 240, 255, 0.35);
    }

    /* MULTIPLICADOR / BADGE SUPERIOR */
    .mc-badge-mult {
      position: absolute;
      top: -8px;
      right: -6px;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1.5px solid #fff;
      box-shadow: 0 2px 8px rgba(255, 0, 85, 0.6);
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .mc-badge-mult.blue {
      background: linear-gradient(135deg, #0088ff, #00f0ff);
      box-shadow: 0 2px 8px rgba(0, 240, 255, 0.6);
    }

    .mc-badge-mult.gold {
      background: linear-gradient(135deg, #ff9900, #ffe600);
      color: #000;
      box-shadow: 0 2px 8px rgba(255, 230, 0, 0.6);
    }

    .mc-card-img-wrap {
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      position: relative;
    }

    .mc-card-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.85));
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .mc-card:hover .mc-card-img {
      transform: scale(1.14);
    }

    .mc-card-action {
      font-family: 'Orbitron', sans-serif;
      font-size: var(--ui-font-size, 11px);
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 1px 1px 0 #000;
      line-height: 1.15;
      margin-bottom: 4px;
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    .mc-card-giftname {
      font-size: 11.5px;
      font-weight: 700;
      color: #e2f4ff;
      opacity: 0.95;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .mc-card-coins {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--neon-gold);
      background: rgba(255, 230, 0, 0.12);
      border: 1px solid rgba(255, 230, 0, 0.35);
      padding: 2px 8px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .mc-card-gift-mini {
      position: absolute;
      bottom: -4px;
      right: -6px;
      width: 24px;
      height: 24px;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9));
      background: rgba(8, 14, 24, 0.85);
      border-radius: 6px;
      padding: 2px;
      border: 1px solid rgba(0, 240, 255, 0.45);
      z-index: 2;
    }

    /* ESTILO TIRA S2E */
    .layout-s2e {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      background: transparent !important;
      padding: 8px 12px;
    }

    .s2e-strip-card {
      background: rgba(14, 18, 26, 0.85);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 72px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
    }

    .s2e-strip-card .s2e-mult {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 6px rgba(0,240,255,0.8);
    }

    .s2e-strip-card .s2e-mob-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
    }

    .s2e-strip-card .s2e-gift-box {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .s2e-strip-card .s2e-gift-box img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
    }

    /* ESTILO PLANO / FLAT */
    .layout-flat {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg-glass);
      border: 1.5px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: 96vw;
    }

    .flat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 24, 42, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 10px;
      padding: 5px 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .flat-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    }

    .flat-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .flat-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--neon-cyan);
    }

    .flat-coins {
      font-size: 10px;
      color: #9cb3c9;
    }

    /* ESTILO ESTÁTICO / GRID */
    .layout-static {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
      gap: 12px;
      max-width: min(96vw, 840px);
      padding: 10px;
    }

    /* TOAST DE EVENTOS */
    .mc-event-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(8, 14, 24, 0.9);
      border: 1.5px solid var(--neon-cyan);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 240, 255, 0.35);
      border-radius: 14px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
    }

    .mc-event-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-icon-box {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      flex-shrink: 0;
    }

    .toast-user {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .toast-desc {
      font-size: 11px;
      font-weight: 700;
      color: var(--neon-cyan);
    }

    /* CORAZONES FLOTANTES */
    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      animation: floatUpFade 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--rnd-x, 0px), -120px, 0) scale(1.3);
      }
    }
  </style>
</head>
<body>
  <div id="mc-root">
    <!-- BARRA SUPERIOR DE ESTADO MODULAR (SIN FACCIONES) -->
    <header class="mc-topbar-hud" id="topbar-hud">
      <!-- Likes Goal con Gatito Dando Like y Escudo de Energía -->
      <div class="hud-pill pill-likes-goal" id="hud-likes-goal-pill" style="display:none">
        <div class="hud-heart-wrapper">
          <img src="/gifts/cute-cat-5-coins.webp" class="svg-heart-goal heart-pulse-active" id="hud-heart-goal-svg" alt="Gatito Like" style="width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,240,255,0.7));" onerror="this.src='/gifts/rose-1-coins.webp';" />
        </div>
        <div class="likes-goal-meta">
          <span class="likes-goal-title" id="likes-goal-title" style="color:var(--neon-cyan);">Meta de likes</span>
          <span class="likes-goal-count"><span id="likes-current-cycle">0</span> / <span id="likes-goal-target">50</span></span>
        </div>
      </div>

      <!-- Badge Seguidor SVG -->
      <div class="hud-pill pill-follow" id="hud-follow-pill" title="Último seguidor registrado">
        <svg class="svg-follow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        <span class="hud-label">FOLLOW:</span>
        <span class="hud-value" id="hud-last-follower">@Streamer</span>
      </div>

      <!-- Tótems Stackeables Activos -->
      <div class="hud-pill pill-totems-stack" id="hud-totems-pill" title="Tótems de inmortalidad stackeables">
        <svg class="svg-totem-icon" viewBox="0 0 24 24" fill="none" stroke="#ffe600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span class="hud-label">TÓTEMS:</span>
        <span class="hud-value" id="hud-totems-count">∞ Stackeable</span>
      </div>
    </header>

    <!-- Contenedor dinámico según estilo (carousel | static | flat) -->
    <main id="mc-content-container"></main>
  </div>

  <!-- TOAST DE EVENTOS -->
  <aside class="mc-event-toast" id="mc-event-toast" aria-live="polite">
    <div class="toast-icon-box" id="toast-icon-box"></div>
    <div>
      <div class="toast-user" id="toast-user">@Usuario</div>
      <div class="toast-desc" id="toast-desc">¡Acción Activada!</div>
    </div>
  </aside>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pathName = window.location.pathname.toLowerCase();

    function detectInitialStyle() {
      if (urlParams.get('style')) return urlParams.get('style');
      if (pathName.includes('estatico') || pathName.includes('static')) return 'static';
      if (pathName.includes('plano') || pathName.includes('flat')) return 'flat';
      return 'carousel';
    }

    let likesCycle = 0;
    let totalLikes = 0;

    function applyOverlaySettings(settings = {}) {
      if (!settings) return;
      if (settings.scale !== undefined && settings.scale !== null) {
        const s = Number(settings.scale);
        if (!isNaN(s) && s > 0) {
          const val = s > 5 ? (s / 100).toFixed(2) : s.toFixed(2);
          mcRoot.style.setProperty('--ui-scale', val);
        }
      }
      if (settings.speed !== undefined && settings.speed !== null) {
        const sp = Number(settings.speed);
        if (!isNaN(sp) && sp > 0) {
          document.documentElement.style.setProperty('--carousel-speed', `${sp}s`);
        }
      }
      if (settings.fontSize !== undefined && settings.fontSize !== null) {
        const fs = Number(settings.fontSize);
        if (!isNaN(fs) && fs > 0) {
          document.documentElement.style.setProperty('--ui-font-size', `${fs}px`);
        }
      }
      if (settings.opacity !== undefined && settings.opacity !== null) {
        const op = Number(settings.opacity);
        if (!isNaN(op)) {
          const alpha = op > 1 ? (op / 100).toFixed(2) : op.toFixed(2);
          document.documentElement.style.setProperty('--bg-glass-alpha', alpha);
          if (Number(alpha) === 0) {
            document.documentElement.style.setProperty('--border-glass', 'rgba(0, 240, 255, 0.15)');
          } else {
            document.documentElement.style.setProperty('--border-glass', 'rgba(0, 240, 255, 0.38)');
          }
        }
      }
    }

    if (urlParams.get('scale')) applyOverlaySettings({ scale: urlParams.get('scale') });
    if (urlParams.get('speed')) applyOverlaySettings({ speed: urlParams.get('speed') });
    if (urlParams.get('fontSize') || urlParams.get('text_size')) applyOverlaySettings({ fontSize: urlParams.get('fontSize') || urlParams.get('text_size') });
    if (urlParams.get('opacity')) applyOverlaySettings({ opacity: urlParams.get('opacity') });

    let mcState = {
      style: detectInitialStyle(),
      showTotems: true,
      likeGoal: null,
      lastFollower: 'En espera...',
      totalLikes: 0,
      items: [
        { id: '1', gift_name: 'Rosa', icon_file: 'rose-1-coins.webp', action_image: '', coins: 1, action_label: '⚡ Rayo Trueno', mult: 'x1' },
        { id: '2', gift_name: 'GG', icon_file: 'gg-1-coins.webp', action_image: '', coins: 1, action_label: '🧨 TNT Box 100%', mult: 'x1' },
        { id: '3', gift_name: 'Maracas', icon_file: 'maracas-1-coins.webp', action_image: '', coins: 1, action_label: '🛡️ +1 Tótem Stack', mult: '+1' },
        { id: '4', gift_name: 'Ice Cream Cone', icon_file: 'ice-cream-cone-1-coins.webp', action_image: '', coins: 1, action_label: '🛡️ Kit Cuero Niv 10', mult: 'KIT' },
        { id: '5', gift_name: 'Heart Me', icon_file: 'heart-me-1-coins.webp', action_image: '', coins: 1, action_label: '💀 Esqueleto Hostil', mult: 'x1' },
        { id: '6', gift_name: 'TikTok', icon_file: 'tiktok-1-coins.webp', action_image: '', coins: 1, action_label: '🐝 Enjambre Abejas', mult: 'x1' },
        { id: '7', gift_name: 'Cute Cat', icon_file: 'cute-cat-5-coins.webp', action_image: '', coins: 5, action_label: '🛡️ Escudo Energía', mult: 'ESCUDO' },
        { id: '8', gift_name: 'Finger Heart', icon_file: 'finger-heart-5-coins.webp', action_image: '', coins: 5, action_label: '⚡ Super Rayo (DPS)', mult: 'RAYO' },
        { id: '9', gift_name: 'Mic', icon_file: 'mic-5-coins.webp', action_image: '', coins: 5, action_label: '🧙 Orbe Aliado', mult: 'ORBE' },
        { id: '10', gift_name: 'Fireball', icon_file: 'fireball-5-coins.webp', action_image: '', coins: 5, action_label: '⚔️ Corona Espadas', mult: 'x1' },
        { id: '11', gift_name: 'Rosa', icon_file: 'rosa-10-coins.webp', action_image: '', coins: 10, action_label: '🛡️ Kit Hierro Niv 10', mult: 'KIT' },
        { id: '12', gift_name: 'Balloons', icon_file: 'balloons-10-coins.webp', action_image: '', coins: 10, action_label: '🕳️ Agujero Negro', mult: 'x1' },
        { id: '13', gift_name: 'Perfume', icon_file: 'perfume-15-coins.webp', action_image: '', coins: 15, action_label: '🛡️ Kit Diamante Niv 10', mult: 'KIT' },
        { id: '14', gift_name: 'Doughnut', icon_file: 'doughnut-30-coins.webp', action_image: '', coins: 30, action_label: '🎠 Carrusel Mágico', mult: 'x1' },
        { id: '15', gift_name: 'Capybara', icon_file: 'capybara-30-coins.webp', action_image: '', coins: 30, action_label: '🛡️ +10 Tótems Stack', mult: '+10' },
        { id: '16', gift_name: 'Paper Crane', icon_file: 'paper-crane-99-coins.webp', action_image: '', coins: 99, action_label: '🛡️ Kit Netherite Niv 10', mult: 'GOD' },
        { id: '17', gift_name: 'Cap', icon_file: 'cap-99-coins.webp', action_image: '', coins: 99, action_label: '✝️ Cruz de Rayos', mult: 'RAYO' },
        { id: '18', gift_name: 'Game Controller', icon_file: 'game-controller-100-coins.webp', action_image: '', coins: 100, action_label: '☢️ Bomba Atómica', mult: 'NUKE' },
        { id: '19', gift_name: 'Sun Crown', icon_file: 'sun-crown-199-coins.webp', action_image: '', coins: 199, action_label: '☀️ Sol Cruel (DPS 10)', mult: 'SOL' },
        { id: '20', gift_name: 'Hearts', icon_file: 'hearts-199-coins.webp', action_image: '', coins: 199, action_label: '💀 La Parka (Corazón)', mult: 'PARKA' },
        { id: '21', gift_name: 'Panda Climb', icon_file: 'panda-climb-199-coins.webp', action_image: '', coins: 199, action_label: '💀 La Parka (Panda)', mult: 'PARKA' },
        { id: '22', gift_name: 'Boxing Gloves', icon_file: 'boxing-gloves-299-coins.webp', action_image: '', coins: 299, action_label: '🌀 Hakai Destrucción', mult: 'HAKAI' },
        { id: '23', gift_name: 'Money Gun', icon_file: 'money-gun-500-coins.webp', action_image: '', coins: 500, action_label: '✧ Arcángel Metatrón', mult: 'BOSS' },
        { id: '24', gift_name: 'Galaxy', icon_file: 'galaxy-1000-coins.webp', action_image: '', coins: 1000, action_label: '🐉 6 Dragones (DPS 10)', mult: 'DRAGON' }
      ]
    };

    const container = document.getElementById('mc-content-container');
    const hudLastFollower = document.getElementById('hud-last-follower');
    const likesCurrentCycleEl = document.getElementById('likes-current-cycle');
    const likesGoalPill = document.getElementById('hud-likes-goal-pill');
    const likesGoalTitle = document.getElementById('likes-goal-title');
    const likesGoalTarget = document.getElementById('likes-goal-target');
    const hudHeartGoalSvg = document.getElementById('hud-heart-goal-svg');
    const eventToast = document.getElementById('mc-event-toast');
    const toastIconBox = document.getElementById('toast-icon-box');
    const toastUser = document.getElementById('toast-user');
    const toastDesc = document.getElementById('toast-desc');
    const mcRoot = document.getElementById('mc-root');

    function cleanGiftPath(raw) {
      if (!raw) return '/gifts/rose-1-coins.webp';
      const s = String(raw).trim();
      if (s === 'LIKE_HEART' || s === 'FOLLOW_ICON') return s;
      if (s.startsWith('http://') || s.startsWith('https://')) return s;
      const clean = s.replace(/^(\.?\/)?gifts\//i, '');
      return `/gifts/${clean || 'rose-1-coins.webp'}`;
    }

    function extractMultiplierBadge(actionLabel, coins) {
      const txt = String(actionLabel || '');
      const match = txt.match(/x\d+|\+\d+/i);
      if (match) return match[0];
      if (txt.toLowerCase().includes('drag')) return '🐉';
      if (txt.toLowerCase().includes('parka') || txt.toLowerCase().includes('muerte')) return '💀';
      if (txt.toLowerCase().includes('sol')) return '☀️';
      if (txt.toLowerCase().includes('kit') || txt.toLowerCase().includes('armadura')) return '⚔️';
      if (txt.toLowerCase().includes('totem')) return '🛡️';
      if (coins >= 1000) return '⭐';
      return 'x1';
    }

    function renderGiftIconOrEmoji(gSrc, cls = 'mc-card-img') {
      if (gSrc === 'LIKE_HEART') {
        return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-size:32px;">❤️</div>`;
      }
      if (gSrc === 'FOLLOW_ICON') {
        return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-size:30px;">🐺</div>`;
      }
      return `<img src="${gSrc}" class="${cls}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/rose-1-coins.webp';" />`;
    }

    function renderOverlay() {
      hudLastFollower.textContent = mcState.lastFollower || '@Streamer';

      const items = Array.isArray(mcState.items) && mcState.items.length > 0 ? mcState.items : [];
      const activeStyle = urlParams.get('style') || (
        pathName.includes('estatico') ? 'static' :
        pathName.includes('plano') ? 'flat' :
        pathName.includes('carrusel') ? 'carousel' :
        pathName.includes('s2e') ? 's2e' :
        mcState.style || 'carousel'
      );

      if (activeStyle === 's2e') {
        container.className = 'layout-s2e';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const actSrc = item.action_image ? cleanGiftPath(item.action_image) : '';
          const mult = item.mult || extractMultiplierBadge(item.action_label, item.coins);
          const mainImg = actSrc || (gSrc !== 'LIKE_HEART' && gSrc !== 'FOLLOW_ICON' ? gSrc : '/gifts/rose-1-coins.webp');
          let giftIconHtml = '';
          if (gSrc === 'LIKE_HEART') {
            giftIconHtml = `<span style="font-size:18px;">❤️</span>`;
          } else if (gSrc === 'FOLLOW_ICON') {
            giftIconHtml = `<span style="font-size:18px;">🐺</span>`;
          } else {
            giftIconHtml = `<img src="${gSrc}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/rose-1-coins.webp';" />`;
          }

          return `
            <div class="s2e-strip-card mc-item-node" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <span class="s2e-mult">${mult}</span>
              <img src="${mainImg}" class="s2e-mob-img" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/rose-1-coins.webp';" />
              <div class="s2e-gift-box">${giftIconHtml}</div>
            </div>
          `;
        }).join('');
      } else if (activeStyle === 'flat') {
        container.className = 'layout-flat';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const actSrc = item.action_image ? cleanGiftPath(item.action_image) : '';
          const mult = item.mult || extractMultiplierBadge(item.action_label, item.coins);
          const mainImgHtml = actSrc ? `<img src="${actSrc}" class="flat-icon" onerror="this.src='/gifts/rose-1-coins.webp';" />` : renderGiftIconOrEmoji(gSrc, 'flat-icon');
          return `
            <div class="flat-pill mc-item-node" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              ${mainImgHtml}
              <div class="flat-meta">
                <span class="flat-action">${item.action_label || item.gift_name}</span>
                <span class="flat-coins">${item.gift_name} • ${item.coins > 0 ? item.coins + ' 🪙' : ''} (${mult})</span>
              </div>
            </div>
          `;
        }).join('');
      } else if (activeStyle === 'static') {
        container.className = 'layout-static';
        container.innerHTML = items.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const actSrc = item.action_image ? cleanGiftPath(item.action_image) : '';
          const mult = item.mult || extractMultiplierBadge(item.action_label, item.coins);
          const mainImgHtml = actSrc
            ? `<img src="${actSrc}" class="mc-card-img" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/rose-1-coins.webp';" /><img src="${gSrc}" class="mc-card-gift-mini" onerror="this.style.display='none'" />`
            : renderGiftIconOrEmoji(gSrc, 'mc-card-img');
          return `
            <div class="mc-card mc-item-node" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <span class="mc-badge-mult ${item.coins >= 500 ? 'gold' : item.coins >= 30 ? 'blue' : ''}">${mult}</span>
              <div class="mc-card-img-wrap">
                ${mainImgHtml}
              </div>
              <div class="mc-card-action">${item.action_label || item.gift_name}</div>
              <div class="mc-card-giftname">${item.gift_name}</div>
              <div class="mc-card-coins">${item.coins > 0 ? item.coins + ' 🪙' : (item.mult || 'Evento')}</div>
            </div>
          `;
        }).join('');
      } else {
        const loopItems = items.length > 0 ? [...items, ...items] : [];
        container.className = 'layout-carousel';
        container.innerHTML = `<div class="carousel-track">` + loopItems.map(item => {
          const gSrc = cleanGiftPath(item.icon_file);
          const actSrc = item.action_image ? cleanGiftPath(item.action_image) : '';
          const mult = item.mult || extractMultiplierBadge(item.action_label, item.coins);
          const mainImgHtml = actSrc
            ? `<img src="${actSrc}" class="mc-card-img" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/rose-1-coins.webp';" /><img src="${gSrc}" class="mc-card-gift-mini" onerror="this.style.display='none'" />`
            : renderGiftIconOrEmoji(gSrc, 'mc-card-img');
          return `
            <div class="mc-card mc-item-node" data-gift-name="${(item.gift_name || '').toLowerCase()}">
              <span class="mc-badge-mult ${item.coins >= 500 ? 'gold' : item.coins >= 30 ? 'blue' : ''}">${mult}</span>
              <div class="mc-card-img-wrap">
                ${mainImgHtml}
              </div>
              <div class="mc-card-action">${item.action_label || item.gift_name}</div>
              <div class="mc-card-giftname">${item.gift_name}</div>
              <div class="mc-card-coins">${item.coins > 0 ? item.coins + ' 🪙' : (item.mult || 'Evento')}</div>
            </div>
          `;
        }).join('') + `</div>`;
      }
    }

    let toastTimeout = null;
    function triggerToast(type, user, desc) {
      clearTimeout(toastTimeout);
      eventToast.className = 'mc-event-toast show';
      if (type === 'follow') {
        toastIconBox.innerHTML = `
          <svg style="width:20px;height:20px;color:var(--neon-cyan);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
        `;
      } else if (type === 'like') {
        toastIconBox.innerHTML = `
          <svg style="width:20px;height:20px;color:#ff0055;" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        `;
      } else {
        toastIconBox.innerHTML = `
          <svg style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="#ffe600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"/>
            <rect x="2" y="7" width="20" height="5"/>
            <line x1="12" y1="22" x2="12" y2="7"/>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
          </svg>
        `;
      }
      toastUser.textContent = '@' + String(user || 'Usuario').replace(/^@/, '');
      toastDesc.textContent = desc || '';
      toastTimeout = setTimeout(() => {
        eventToast.classList.remove('show');
      }, 3500);
    }

    function spawnFloatingHeart() {
      const h = document.createElement('div');
      h.className = 'floating-heart';
      const rect = hudHeartGoalSvg.getBoundingClientRect();
      const x = rect.left + rect.width / 2 + (Math.random() * 20 - 10);
      const y = rect.top;
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      h.style.setProperty('--rnd-x', (Math.random() * 60 - 30) + 'px');
      h.innerHTML = `
        <svg style="width:22px;height:22px;fill:#ff0055;filter:drop-shadow(0 0 8px rgba(255,0,85,0.9));" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      `;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }

    function onFollowEvent(user) {
      const u = String(user || 'Viewer').replace(/^@/, '');
      mcState.lastFollower = '@' + u;
      hudLastFollower.textContent = '@' + u;
      triggerToast('follow', u, 'Nuevo seguidor');
    }

    function onLikeEvent(user, count = 1) {
      const u = String(user || 'Viewer').replace(/^@/, '');
      const c = Number(count) || 1;
      totalLikes += c;
      likesCycle += c;

      const goal = Math.max(0, Number(mcState.likeGoal?.threshold) || 0);
      if (goal) {
        hudHeartGoalSvg.classList.remove('heart-pop-burst');
        void hudHeartGoalSvg.offsetWidth;
        hudHeartGoalSvg.classList.add('heart-pop-burst');
        spawnFloatingHeart();
        if (likesCycle >= goal) {
          triggerToast('like', u, mcState.likeGoal.label || `Meta de ${goal} likes`);
          likesCycle %= goal;
        }
      }

      likesCurrentCycleEl.textContent = likesCycle;
    }

    function onGiftEvent(user, giftName, coins = 1) {
      const u = String(user || 'Donador').replace(/^@/, '');
      triggerToast('gift', u, `${giftName} (${coins} 🪙)`);

      const g = String(giftName || '').toLowerCase().trim();
      if (g) {
        document.querySelectorAll('.mc-item-node').forEach(node => {
          const gn = node.getAttribute('data-gift-name') || '';
          if (gn && (gn === g || g.includes(gn) || gn.includes(g))) {
            node.style.transform = 'scale(1.18)';
            node.style.borderColor = 'var(--neon-gold)';
            setTimeout(() => {
              node.style.transform = '';
              node.style.borderColor = '';
            }, 700);
          }
        });
      }
    }

    function applyServerPayload(d) {
      if (!d) return;
      if (d.duel && d.duel.gift_scale) {
        mcRoot.style.setProperty('--ui-scale', (d.duel.gift_scale / 100).toFixed(2));
      }
      if (d.mc_overlay) {
        applyOverlaySettings(d.mc_overlay);
        if (d.mc_overlay.style) mcState.style = d.mc_overlay.style;
        if (d.mc_overlay.showTotems !== undefined) mcState.showTotems = d.mc_overlay.showTotems;
        mcState.likeGoal = d.mc_overlay.likeGoal || null;
        likesGoalPill.style.display = mcState.likeGoal ? '' : 'none';
        if (mcState.likeGoal) {
          likesGoalTitle.textContent = mcState.likeGoal.label || `Meta de ${mcState.likeGoal.threshold} likes`;
          likesGoalTarget.textContent = mcState.likeGoal.threshold;
          likesGoalPill.title = likesGoalTitle.textContent;
          likesCurrentCycleEl.textContent = likesCycle % Math.max(1, Number(mcState.likeGoal.threshold) || 1);
        }
        if (Array.isArray(d.mc_overlay.items)) {
          mcState.items = d.mc_overlay.items;
        }
        renderOverlay();
      }
      if (d.type === 'follow' || d.event === 'follow') {
        const u = d.data?.user || d.data?.nickname || d.user || 'Viewer';
        onFollowEvent(u);
      } else if (d.type === 'like' || d.event === 'like') {
        const u = d.data?.user || d.data?.nickname || d.user || 'Viewer';
        const c = d.data?.count || d.count || 1;
        onLikeEvent(u, c);
      } else if (d.type === 'gift' && d.data) {
        onGiftEvent(d.data.user, d.data.title, d.data.coins || 1);
      } else if (d.type === 'tiktok_event') {
        if (d.event === 'follow') {
          onFollowEvent(d.data?.nickname || d.data?.uniqueId || 'Viewer');
        } else if (d.event === 'like') {
          onLikeEvent(d.data?.nickname || d.data?.uniqueId || 'Viewer', d.data?.likeCount || 1);
        } else if (d.event === 'gift') {
          onGiftEvent(d.data?.nickname || d.data?.uniqueId || 'Donador', d.data?.giftName || 'Regalo', d.data?.diamondCount || 1);
        }
      }
    }

    renderOverlay();

    fetch('/api/estado')
      .then(r => r.json())
      .then(d => applyServerPayload(d))
      .catch(() => {});

    const evt = new EventSource('/api/eventos');
    evt.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        applyServerPayload(d);
      } catch (err) {}
    };
  </script>
</body>
</html>
