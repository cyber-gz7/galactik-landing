<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>Overlay Cinemático de Alertas - Galactic Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@600;700;800&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Rajdhani', 'Inter', system-ui, sans-serif;
      color: #ffffff;
      pointer-events: none;
    }

    #cinematic-root {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      overflow: hidden;
    }

    /* CONTENEDOR DE VIDEO Y CANVAS CHROMA KEY */
    .viewport-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .viewport-layer.active {
      opacity: 1;
      transform: scale(1);
    }

    #video-source {
      display: none !important;
    }

    #chroma-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.85));
    }

    /* CAPA DE TEXTO FLOTANTE SUPERPUESTO ANIMADO */
    .alert-floating-layer {
      position: absolute;
      bottom: 14%;
      left: 6%;
      right: 6%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      opacity: 0;
      transform: translateY(35px) scale(0.92);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .alert-floating-layer.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: alertFloat 3s ease-in-out infinite alternate;
    }

    @keyframes alertFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(1.01); }
    }

    .alert-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(12, 16, 26, 0.82);
      border: 1.5px solid rgba(0, 240, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
      padding: 12px 28px 12px 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75), 0 0 25px rgba(0, 240, 255, 0.35);
      max-width: 90%;
    }

    .alert-gift-thumb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(10, 15, 30, 0.9) 80%);
      border: 2px solid rgba(0, 240, 255, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.5);
    }

    .alert-gift-thumb img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      display: block;
    }

    .alert-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .alert-user-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-badge-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    .alert-username {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px #000000, 0 0 12px rgba(255, 255, 255, 0.4);
      letter-spacing: 0.3px;
    }

    .alert-action-detail {
      font-family: 'Rajdhani', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #ffe49e;
      text-shadow: 0 2px 4px #000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-coins-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 167, 81, 0.2);
      border: 1px solid rgba(255, 167, 81, 0.6);
      border-radius: 999px;
      padding: 1px 8px;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 800;
      color: #ffa751;
      text-shadow: 0 0 6px rgba(255, 167, 81, 0.6);
    }

    .svg-coin {
      width: 12px;
      height: 12px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="cinematic-root">
    <!-- CAPA DE VIDEO CHROMA -->
    <div class="viewport-layer" id="viewport-layer">
      <video id="video-source" playsinline muted crossOrigin="anonymous"></video>
      <canvas id="chroma-canvas"></canvas>
    </div>

    <!-- CAPA DE TEXTO FLOTANTE -->
    <div class="alert-floating-layer" id="floating-layer">
      <div class="alert-card">
        <div class="alert-gift-thumb">
          <img id="alert-icon" src="/gifts/default-gift.svg" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='/gifts/default-gift.svg';" alt="Regalo">
        </div>
        <div class="alert-content">
          <div class="alert-user-row">
            <span class="alert-badge-tag">NUEVA DONACION</span>
            <span class="alert-username" id="alert-user">@Usuario</span>
          </div>
          <div class="alert-action-detail">
            <span id="alert-action">Envió Rosa</span>
            <div class="alert-coins-pill" id="coins-pill">
              <svg class="svg-coin" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#ffa751" stroke-width="2"/>
                <path d="M12 6v12M8 9.5h8M8 14.5h8" stroke="#ffa751" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <span id="alert-coins">1</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="alert-audio" preload="auto"></audio>

  <script>
    // Referencias DOM
    const viewportLayer = document.getElementById('viewport-layer');
    const video = document.getElementById('video-source');
    const canvas = document.getElementById('chroma-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const floatingLayer = document.getElementById('floating-layer');
    const alertUser = document.getElementById('alert-user');
    const alertAction = document.getElementById('alert-action');
    const alertCoins = document.getElementById('alert-coins');
    const alertIcon = document.getElementById('alert-icon');
    const coinsPill = document.getElementById('coins-pill');
    const audio = document.getElementById('alert-audio');

    // Cola de Alertas Secuencial No Bloqueante (FIFO)
    const alertQueue = [];
    let isProcessing = false;
    let animFrameId = null;

    // Configuración de Chroma Key
    const CHROMA_KEY = {
      r: 0,
      g: 255,
      b: 0,
      similarity: 0.38,
      smoothness: 0.12
    };

    function processChromaFrame() {
      if (video.paused || video.ended) return;

      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
      }

      if (canvas.width > 0 && canvas.height > 0) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = frame.data;
        const len = data.length;

        const targetR = CHROMA_KEY.r / 255;
        const targetG = CHROMA_KEY.g / 255;
        const targetB = CHROMA_KEY.b / 255;
        const sim = CHROMA_KEY.similarity;
        const smooth = CHROMA_KEY.smoothness;

        for (let i = 0; i < len; i += 4) {
          const r = data[i] / 255;
          const g = data[i + 1] / 255;
          const b = data[i + 2] / 255;

          // Distancia Euclídea de color
          const dist = Math.sqrt(
            (r - targetR) * (r - targetR) +
            (g - targetG) * (g - targetG) +
            (b - targetB) * (b - targetB)
          );

          if (dist < sim) {
            data[i + 3] = 0; // Transparente total
          } else if (dist < sim + smooth) {
            // Suavizado en los bordes
            const alphaFactor = (dist - sim) / smooth;
            data[i + 3] = Math.round(data[i + 3] * alphaFactor);
            // Despill para evitar rebote verde en los bordes
            if (g > (r + b) / 2) {
              data[i + 1] = Math.round((r + b) / 2 * 255);
            }
          }
        }

        ctx.putImageData(frame, 0, 0);
      }

      animFrameId = requestAnimationFrame(processChromaFrame);
    }

    async function playAlert(alertItem) {
      const vUrl = alertItem.videoUrl || alertItem.video || '';
      const iUrl = alertItem.imageUrl || alertItem.image || '';
      const hasMedia = Boolean((vUrl && vUrl.trim()) || (iUrl && iUrl.trim()) || alertItem.isModeratorCommand);

      // FILTRO ESTRICTO: Descarte absoluto si no hay video o imagen (Cero overlays fantasma)
      if (!hasMedia) {
        checkQueue();
        return;
      }

      isProcessing = true;

      // 1. Configurar datos de la tarjeta flotante
      const donorName = alertItem.user ? `@${String(alertItem.user).replace(/^@+/, '')}` : '@Donador';
      alertUser.textContent = donorName;
      alertAction.textContent = alertItem.title || alertItem.subtitle || 'Envió un Regalo';
      alertCoins.textContent = alertItem.coins || 1;
      alertIcon.src = alertItem.imageUrl || '/gifts/default-gift.svg';

      if (alertItem.coins && alertItem.coins > 0) {
        coinsPill.style.display = 'inline-flex';
      } else {
        coinsPill.style.display = 'none';
      }

      // 2. Mostrar tarjeta flotante
      floatingLayer.classList.add('visible');

      // 3. Reproducir audio si existe
      if (alertItem.audioUrl) {
        try {
          audio.src = alertItem.audioUrl;
          audio.volume = Math.max(0, Math.min(1, (alertItem.audioVolume ?? 100) / 100));
          await audio.play();
        } catch (_) {}
      }

      // 4. Si hay video con chroma key
      const hasVideo = Boolean(alertItem.videoUrl && alertItem.videoUrl.trim());
      if (hasVideo) {
        video.src = alertItem.videoUrl;
        viewportLayer.classList.add('active');

        try {
          await video.play();
          animFrameId = requestAnimationFrame(processChromaFrame);
        } catch (err) {
          console.warn('No se pudo reproducir video de alerta:', err);
        }
      }

      // 5. Duración de la alerta
      const displayDuration = Math.max(3.5, Number(alertItem.duration) || 5) * 1000;

      await new Promise(resolve => setTimeout(resolve, displayDuration));

      // 6. Transición de salida
      floatingLayer.classList.remove('visible');
      viewportLayer.classList.remove('active');

      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (!video.paused) {
        video.pause();
        video.currentTime = 0;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Pequeño descanso entre alertas consecutivas
      await new Promise(resolve => setTimeout(resolve, 400));

      isProcessing = false;
      checkQueue();
    }

    function enqueueAlert(alertItem) {
      alertQueue.push(alertItem);
      checkQueue();
    }

    function checkQueue() {
      if (isProcessing || alertQueue.length === 0) return;
      const next = alertQueue.shift();
      playAlert(next);
    }

    // Conexión SSE con reconexión automática
    const sseHost = window.location.origin.includes('localhost:4000') || window.location.origin.includes('127.0.0.1:4000')
      ? ''
      : 'http://127.0.0.1:4000';

    function connectSSE() {
      const evt = new EventSource(`${sseHost}/api/eventos`);

      evt.onmessage = e => {
        try {
          const d = JSON.parse(e.data);

          // FILTRO ESTRICTO: Descartar por completo like, tap, follow, share, comment
          if (['follow', 'like', 'share', 'comment', 'chat'].includes(d.type)) return;
          if (d.type === 'tiktok_event') {
            const ev = String(d.event || '').toLowerCase();
            if (['like', 'tap', 'follow', 'share', 'comment', 'chat'].includes(ev)) {
              return; // Cero likes/taps en alertas
            }
          }

          if (d.type === 'custom_alert') {
            const a = d.alert || d;
            const hasMedia = Boolean((a.videoUrl && a.videoUrl.trim()) || (a.video && a.video.trim()) || (a.imageUrl && a.imageUrl.trim()) || (a.image && a.image.trim()) || a.isModeratorCommand);
            if (!hasMedia) return;

            enqueueAlert({
              user: a.title || 'Donador',
              subtitle: a.subtitle,
              videoUrl: a.videoUrl || a.video || '',
              audioUrl: a.audioUrl || '',
              audioVolume: a.audioVolume,
              imageUrl: a.imageUrl || a.image || '',
              coins: a.coins,
              duration: a.duration || 4.5
            });
          } else if (d.type === 'gift' && d.data) {
            const vUrl = d.data.videoUrl || d.data.video || d.data.media_path;
            const iUrl = d.data.imageUrl || d.data.image;
            if (vUrl || iUrl) {
              enqueueAlert({
                user: d.data.user || d.data.nickname || 'Donador',
                title: `Envió ${d.data.title || d.data.giftName || 'Regalo'}`,
                subtitle: `+${d.data.coins || d.data.diamondCount || 1} Diamantes`,
                videoUrl: vUrl || '',
                imageUrl: iUrl || '',
                coins: d.data.coins || d.data.diamondCount || 1,
                duration: 4.5
              });
            }
          }
        } catch (_) {}
      };

      evt.onerror = () => {
        evt.close();
        setTimeout(connectSSE, 2500);
      };
    }

    connectSSE();
  </script>
</body>
</html>
