[package]
name = "gz7live"
version = "2.0.4"
description = "GZ7Live - TikTok Live to Minecraft RCON bridge with Buenos vs Malos"
authors = ["GZ7"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = 2
strip = true
