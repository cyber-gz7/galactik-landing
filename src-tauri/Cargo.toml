[package]
name = "gz7live"
version = "2.1.4"
description = "Galactik Live - TikTok Live to Minecraft RCON bridge with Universal Survival Plugins"
authors = ["CyberGZ7"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = 2
strip = true
