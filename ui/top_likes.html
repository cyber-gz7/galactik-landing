<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Top Likes - GZ7Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;900&family=JetBrains+Mono:wght@700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }
    .likes-card {
      width: 360px;
      background: rgba(18, 12, 16, 0.9);
      border: 2px solid #ff4081;
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85), 0 0 25px rgba(255, 64, 129, 0.3);
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease;
      position: relative;
    }
    .likes-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 64, 129, 0.3);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title-text {
      font-size: 19px;
      font-weight: 900;
      color: #ff4081;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .heart-pulse {
      animation: beat 1s infinite alternate;
    }
    @keyframes beat { from { transform: scale(1); } to { transform: scale(1.25); } }

    .liker-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .liker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 12px;
      transition: all 0.3s ease;
    }
    .liker-row:first-child {
      background: linear-gradient(90deg, rgba(255, 64, 129, 0.18) 0%, rgba(255, 64, 129, 0.04) 100%);
      border-color: rgba(255, 64, 129, 0.6);
    }
    .liker-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .liker-rank {
      font-size: 16px;
      font-weight: 900;
      min-width: 24px;
      text-align: center;
    }
    .rank-1 { color: #ff4081; text-shadow: 0 0 10px rgba(255,64,129,0.7); }

    .liker-user {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    .liker-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: #ff4081;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .empty-state {
      text-align: center;
      color: #8888a4;
      font-size: 13px;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="likes-card" id="card">
    <div class="likes-title">
      <div class="title-text">
        <span class="heart-pulse">💖</span>
        <span>TOP LIKES</span>
      </div>
      <span style="font-size: 12px; color: #ff80ab; font-weight: 700;" id="total-likes-badge">0 LIKES</span>
    </div>

    <div class="liker-list" id="liker-list">
      <div class="empty-state">Toca la pantalla para sumar likes...</div>
    </div>
  </div>

  <script>
    const likerList = document.getElementById('liker-list');
    const totalLikesBadge = document.getElementById('total-likes-badge');
    const card = document.getElementById('card');
    const likersMap = new Map();
    let totalLikes = 0;

    const evt = new EventSource('/api/eventos');
    evt.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        if (d.duel?.gift_scale) {
          card.style.transform = 'scale(' + (d.duel.gift_scale / 100) + ')';
        }
        if (d.type === 'like' && d.data) {
          const user = String(d.data.user || 'Viewer').replace(/^@/, '');
          const count = Number(d.data.count) || 1;
          totalLikes += count;
          totalLikesBadge.textContent = totalLikes.toLocaleString() + ' LIKES';
          const current = likersMap.get(user) || 0;
          likersMap.set(user, current + count);
          updateLikers();
        }
      } catch (err) {}
    };

    function updateLikers() {
      const sorted = Array.from(likersMap.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      if (sorted.length === 0) return;

      likerList.innerHTML = sorted.map(([user, count], idx) => {
        const rank = idx + 1;
        const medal = rank === 1 ? '💖' : (rank === 2 ? '🤍' : (rank === 3 ? '💜' : `#${rank}`));
        return `
          <div class="liker-row">
            <div class="liker-left">
              <span class="liker-rank ${rank === 1 ? 'rank-1' : ''}">${medal}</span>
              <span class="liker-user">@${user}</span>
            </div>
            <span class="liker-count">${count.toLocaleString()} ❤️</span>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
