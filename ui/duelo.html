<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Duelo Bicicleta Royale</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;900&family=JetBrains+Mono:wght@700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }
    .widget-container {
      width: 760px;
      background: rgba(10, 10, 15, 0.88);
      border: 2px solid #2a2a3e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 30px rgba(79, 195, 247, 0.15);
      backdrop-filter: blur(12px);
    }
    .title-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .team-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .team-left { color: #ef5350; text-shadow: 0 0 15px rgba(239,83,80,0.6); }
    .team-right { color: #4fc3f7; text-shadow: 0 0 15px rgba(79,195,247,0.6); }
    .score-box {
      background: #1e1e2e;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 16px;
      color: #ffd700;
      font-family: 'JetBrains Mono', monospace;
    }
    .track-wrapper {
      position: relative;
      width: 100%;
      height: 52px;
      background: #14141f;
      border-radius: 26px;
      border: 2px solid #33334d;
      overflow: visible;
      margin: 20px 0;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
    }
    .track-split {
      position: absolute;
      top: 0; left: 50%;
      width: 4px; height: 100%;
      background: rgba(255,255,255,0.25);
      transform: translateX(-50%);
    }
    .bike-runner {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 44px;
      transition: left 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
      z-index: 10;
    }
    .push-bar {
      height: 100%;
      border-radius: 24px;
      background: linear-gradient(90deg, #ef5350 0%, #ffd700 50%, #4fc3f7 100%);
      transition: width 0.35s ease;
      opacity: 0.85;
    }
    .footer-action {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #a0a0b5;
      font-weight: 700;
    }
    .last-shout {
      text-align: center;
      margin-top: 10px;
      font-size: 15px;
      color: #ffd700;
      min-height: 22px;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.8; } to { opacity: 1; transform: scale(1.02); } }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="title-banner">
      <div class="team-badge team-left">
        <span>TEAM ROJO 🌹</span>
        <span class="score-box" id="wins-left">0 WINS</span>
      </div>
      <div style="font-size: 28px; font-weight: 900; color: #ffd700;">VS</div>
      <div class="team-badge team-right">
        <span class="score-box" id="wins-right">0 WINS</span>
        <span>TEAM AZUL 🎮</span>
      </div>
    </div>

    <div class="track-wrapper">
      <div class="track-split"></div>
      <div class="push-bar" id="push-bar" style="width: 50%;"></div>
      <div class="bike-runner" id="bike-icon" style="left: 50%;">🚴</div>
    </div>

    <div class="footer-action">
      <span>⬅ Rosa / Parka empuja a la Izquierda</span>
      <span>GG / Arcángel empuja a la Derecha ➡</span>
    </div>

    <div class="last-shout" id="last-shout">¡Manda regalos para empujar la bicicleta a la meta!</div>
  </div>

  <script>
    const evtSource = new EventSource('/api/eventos');
    const bike = document.getElementById('bike-icon');
    const bar = document.getElementById('push-bar');
    const winsL = document.getElementById('wins-left');
    const winsR = document.getElementById('wins-right');
    const shout = document.getElementById('last-shout');

    evtSource.onmessage = e => {
      try {
        const data = JSON.parse(e.data);
        if (data.duel) {
          updateDuel(data.duel);
        }
        if (data.type === 'win') {
          shout.textContent = '🎉 ¡' + data.data.name + ' HA GANADO LA RONDA!';
          setTimeout(() => { shout.textContent = '¡Nueva ronda comenzada! Empuja al rival'; }, 4000);
        } else if (data.data && data.data.user) {
          shout.textContent = '⚡ ' + data.data.user + ' envió ' + data.data.title;
        }
      } catch (err) {}
    };

    function updateDuel(d) {
      bike.style.left = d.position + '%';
      bar.style.width = d.position + '%';
      winsL.textContent = d.wins_left + ' WINS';
      winsR.textContent = d.wins_right + ' WINS';
      if (d.gift_scale) {
        const scale = d.gift_scale / 100;
        bike.style.fontSize = (44 * scale) + 'px';
      }
    }
  </script>
</body>
</html>
