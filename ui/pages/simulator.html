<div class="section-card" style="max-width: 700px; margin: 0 auto;">
  <div class="panel-header">
    <div>
      <h2 style="font-size: 20px; font-weight: 700;">Simulador de Regalos TikTok Live</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
        Prueba los comandos RCON, efectos de sonido y la barra de tótems sin necesidad de estar en vivo.
      </p>
    </div>
  </div>

  <div class="input-group" style="margin-top: 16px;">
    <label class="input-label" for="sim-gift-select">Seleccionar Regalo</label>
    <select id="sim-gift-select" class="table-select" style="width: 100%; padding: 10px; font-size: 14px;">
      <!-- Opciones cargadas dinámicamente -->
    </select>
  </div>

  <div class="input-group" style="margin-top: 12px;">
    <label class="input-label" for="sim-donor-input">Nombre del Donador (Minecraft Nick)</label>
    <input type="text" id="sim-donor-input" class="input-field" placeholder="GZ7" value="GZ7" />
  </div>

  <div class="input-group" style="margin-top: 12px;">
    <label class="input-label" for="sim-repeat-input">Cantidad / Repeticiones</label>
    <input type="number" id="sim-repeat-input" class="input-field" value="1" min="1" max="100" />
  </div>

  <div style="margin-top: 16px; padding: 14px; background: var(--bg-main); border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
    <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Detalles del Regalo</div>
    <div id="sim-preview-details" style="font-size: 14px; margin-top: 6px; font-family: var(--font-mono);">
      Selecciona un regalo para ver los detalles
    </div>
  </div>

  <div class="actions-row" style="margin-top: 20px;">
    <button type="button" class="btn-primary" id="btn-fire-sim" style="font-size: 16px; padding: 14px;">
      ⚡ DISPARAR REGALO
    </button>
  </div>
</div>
